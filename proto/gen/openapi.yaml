                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/secretBlocks/{secretBlock}:requestUnlock:
        post:
            tags:
                - SecretBlockService
            description: |-
                RequestSecretBlockUnlock asks for a restricted block's envelope to become
                 available. The server checks the typed confirmation text and computes when
                 the block opens from the block's policy and the server clock — the client
                 has no say in either. See docs/dev/requirements/editor/restricted-secret-block.md.
            operationId: SecretBlockService_RequestSecretBlockUnlock
            parameters:
                - name: secretBlock
                  in: path
                  description: The secretBlock id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RequestSecretBlockUnlockRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SecretBlockSummary'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/secretBlocks/{secretBlock}:summary:
        get:
            tags:
                - SecretBlockService
            description: |-
                GetSecretBlockSummary returns one block without its envelope. It is how a
                 restricted block learns its unlock state without spending a viewing window:
                 GetSecretBlock on a restricted block starts the window the first time it
                 succeeds.
            operationId: SecretBlockService_GetSecretBlockSummary
            parameters:
                - name: secretBlock
                  in: path
                  description: The secretBlock id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SecretBlockSummary'
                default:
