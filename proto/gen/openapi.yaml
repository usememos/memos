                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/secretBlocks/{secretBlock}:updatePolicy:
        post:
            tags:
                - SecretBlockService
            description: |-
                UpdateSecretBlockPolicy restricts a block, changes its policy, or lifts the
                 restriction (an unset policy). Restricting an unrestricted block applies
                 immediately; every change to an already restricted block — tighter or looser —
                 is scheduled and takes effect only after the block's normal unlock delay.
            operationId: SecretBlockService_UpdateSecretBlockPolicy
            parameters:
                - name: secretBlock
                  in: path
                  description: The secretBlock id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateSecretBlockPolicyRequest'
                required: true
            responses:
                "200":
                    description: OK
