    /api/v1/secretBlocks:
        get:
            tags:
                - SecretBlockService
            description: |-
                ListSecretBlocks returns the caller's secret blocks as metadata only.

                 This intentionally does NOT return ciphertext. The management UI only needs
                 hints and timestamps, and bulk-shipping ciphertext would hand an attacker a
                 ready-made offline brute-force corpus. Ciphertext is fetched one record at a
                 time via GetSecretBlock.
            operationId: SecretBlockService_ListSecretBlocks
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListSecretBlocksResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - SecretBlockService
            description: |-
                CreateSecretBlock stores a client-encrypted envelope and returns the record,
                 whose uid the client then writes into the document body.
            operationId: SecretBlockService_CreateSecretBlock
            parameters:
                - name: policy.preset
                  in: query
                  schema:
                    enum:
                        - PRESET_UNSPECIFIED
                        - LOW_IMPACT
                        - HIGH_IMPACT
                    type: string
                    format: enum
                - name: policy.timeZone
                  in: query
                  description: |-
                    IANA time zone the wall-clock times below are read in (e.g. "Asia/Shanghai").
                     Stored with the policy rather than taken from the server process, whose zone
                     is often UTC in a container.
                  schema:
                    type: string
                - name: policy.prompt
                  in: query
                  description: 'Shown before every unlock request: a note from the owner to their future self.'
                  schema:
                    type: string
                - name: policy.confirmText
                  in: query
                  description: |-
                    Must be typed verbatim (modulo surrounding and repeated whitespace) to request
                     an unlock. Not a secret.
                  schema:
                    type: string
                - name: policy.workStartMinute
                  in: query
                  description: |-
                    Working hours as minutes after local midnight, [start, end). Both zero when
                     the preset has no working-hours fast path.
                  schema:
                    type: integer
                    format: int32
                - name: policy.workEndMinute
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: policy.workDelaySeconds
                  in: query
                  description: Wait for a request made inside working hours.
                  schema:
                    type: integer
                    format: int32
                - name: policy.releaseMinute
                  in: query
                  description: |-
                    Local minute of day a request made outside working hours opens at: the first
                     such time strictly after the request.
                  schema:
                    type: integer
                    format: int32
                - name: policy.emergencyQuota
                  in: query
                  description: Emergency unlocks allowed per rolling window. Zero means no emergency path.
                  schema:
                    type: integer
                    format: int32
                - name: policy.emergencyWindowDays
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: policy.viewSeconds
                  in: query
                  description: How long the envelope is served once first fetched.
                  schema:
                    type: integer
                    format: int32
                - name: policy.readyTtlSeconds
                  in: query
                  description: How long an available but unviewed request stays available.
                  schema:
                    type: integer
                    format: int32
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SecretBlock'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SecretBlock'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/v1/secretBlocks/{secretBlock}:
        get:
            tags:
                - SecretBlockService
            description: |-
                GetSecretBlock returns one secret block including its ciphertext envelope.
                 Callers must own the record. Responses are sent with `Cache-Control: no-store`
                 so ciphertext does not linger in the browser's disk cache.
            operationId: SecretBlockService_GetSecretBlock
            parameters:
                - name: secretBlock
                  in: path
                  description: The secretBlock id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SecretBlock'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        delete:
            tags:
                - SecretBlockService
            description: |-
                DeleteSecretBlock permanently destroys a record. There is no recovery, and no
                 caller other than the user acting deliberately ever invokes this — deleting or
                 duplicating a document leaves its referenced secrets untouched.

                 A restricted block cannot be deleted directly: deleting it is the same as
                 lifting its restriction, so the restriction has to be lifted first (which
                 waits like any other policy change). Fails with FAILED_PRECONDITION otherwise.
            operationId: SecretBlockService_DeleteSecretBlock
            parameters:
                - name: secretBlock
                  in: path
                  description: The secretBlock id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        patch:
            tags:
                - SecretBlockService
            description: |-
                UpdateSecretBlock replaces a record's envelope in place. This is how changing
                 a passphrase works, and replacing rather than appending is the whole reason
                 ciphertext lives here instead of inline in the document: a superseded envelope
                 leaves no copy behind in memo history or git.
            operationId: SecretBlockService_UpdateSecretBlock
            parameters:
                - name: secretBlock
                  in: path
                  description: The secretBlock id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SecretBlock'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SecretBlock'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
