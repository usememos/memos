    /api/v1/public/pages:search:
        get:
            tags:
                - PublicSiteService
            description: |-
                SearchPublicPages searches this site's published pages.

                 It searches the publication snapshots only, never the library index. That is
                 not an optimisation: a snapshot is frozen at publish time while the source
                 document keeps being edited, so a shared index would let an anonymous reader
                 learn that a word appears in an article from text that was never published.
                 The current matching is a plain substring scan — see
                 docs/dev/design/20260823-public-publishing/tech-design.md §5.
            operationId: PublicSiteService_SearchPublicPages
            parameters:
                - name: site
                  in: query
                  description: 'Optional explicit site for platform-path access. Format: sites/{site}'
                  schema:
                    type: string
                - name: query
                  in: query
                  description: The reader's query. Matched as a substring against title, summary and body.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SearchPublicPagesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
