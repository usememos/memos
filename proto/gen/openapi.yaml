                    description: |-
                        Required. Which attachment to issue a URL for. Lenient about shape, because
                         this is usually pasted by a person: a resource name ("attachments/{uid}"),
                         a /file/... link relative or absolute, or the markdown reference the app's
                         attachment menu copies ("![report.pdf](/file/attachments/{uid}/report.pdf)")
                         all address the same attachment.
        GetDownloadUrlResponse:
            type: object
            properties:
                url:
                    type: string
                    description: |-
                        The URL to fetch. Absolute, carries its own authorization, and is valid
                         only for this one attachment until expire_time.
                name:
                    type: string
                    description: |-
                        The attachment's resource name, resolved from the request.
                         Format: attachments/{attachment}
                filename:
                    type: string
                    description: The display filename, suitable as the local filename to save under.
                type:
                    type: string
                    description: The MIME type of the bytes the URL will serve.
                size:
                    type: string
                    description: |-
                        Size in bytes, so a caller can decide whether it wants the file at all
                         before fetching it.
                expireTime:
                    type: string
                    description: When the URL stops working.
                    format: date-time
        GetIndexStatusResponse:
            type: object
            properties:
                pending:
                    type: integer
                    description: pending is the number of memos waiting to be indexed.
                    format: int32
                processing:
                    type: integer
                    description: processing is the number of memos currently being indexed.
                    format: int32
                failed:
                    type: integer
                    description: failed is the number of memos whose indexing failed.
                    format: int32
                done:
                    type: integer
                    description: done is the number of memos successfully indexed.
                    format: int32
                embeddingConfigured:
                    type: boolean
                    description: embedding_configured reports whether a semantic-search embedding model is set up.
        GetUserWebhookSigningSecretResponse:
            type: object
            properties:
                signingSecret:
                    type: string
                    description: The signing secret, in the Standard Webhooks "whsec_<base64>" form.
        GetWorkspaceTreeResponse:
            type: object
            properties:
                nodes:
                    type: array
                    items:
                        $ref: '#/components/schemas/WorkspaceTreeNode'
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        IdentityProvider:
            required:
                - type
                - title
                - config
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the identity provider.
                         Format: identity-providers/{idp}
                type:
                    enum:
                        - TYPE_UNSPECIFIED
                        - OAUTH2
                    type: string
                    description: Required. The type of the identity provider.
                    format: enum
                title:
                    type: string
                    description: Required. The display title of the identity provider.
                identifierFilter:
                    type: string
                    description: Optional. Filter applied to user identifiers.
                config:
                    allOf:
                        - $ref: '#/components/schemas/IdentityProviderConfig'
                    description: Required. Configuration for the identity provider.
        IdentityProviderConfig:
            type: object
            properties:
                oauth2Config:
                    $ref: '#/components/schemas/OAuth2Config'
        InstanceProfile:
            type: object
            properties:
                version:
                    type: string
                    description: Version is the current version of instance.
                demo:
                    type: boolean
                    description: Demo indicates if the instance is in demo mode.
                instanceUrl:
                    type: string
                    description: Instance URL is the URL of the instance.
                admin:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: |-
                        The first administrator who set up this instance, for display purposes.
                         May be null on an instance that has lost all admins; use needs_setup to
                         determine whether initial setup is actually required.
                commit:
                    type: string
                    description: Commit is the current build commit of instance.
                needsSetup:
                    type: boolean
                    description: |-
                        NeedsSetup is true when the instance has no users yet and requires initial
                         setup (creating the first admin account). Unlike a null admin, this stays
                         false once any user exists, so an instance that has lost its admins is not
                         mistaken for a fresh install.
            description: Instance profile message containing basic instance information.
        InstanceSetting:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the instance setting.
                         Format: instance/settings/{setting}
                generalSetting:
                    $ref: '#/components/schemas/InstanceSetting_GeneralSetting'
                storageSetting:
                    $ref: '#/components/schemas/InstanceSetting_StorageSetting'
                memoRelatedSetting:
                    $ref: '#/components/schemas/InstanceSetting_MemoRelatedSetting'
                tagsSetting:
                    $ref: '#/components/schemas/InstanceSetting_TagsSetting'
                notificationSetting:
                    $ref: '#/components/schemas/InstanceSetting_NotificationSetting'
                aiSetting:
                    $ref: '#/components/schemas/InstanceSetting_AISetting'
                backupSetting:
                    $ref: '#/components/schemas/InstanceSetting_BackupSetting'
            description: An instance setting resource.
        InstanceSetting_AIModelConfig:
            type: object
            properties:
                id:
                    type: string
                    description: id is the model identifier sent to the provider API (e.g. "deepseek-chat").
                name:
                    type: string
                    description: name is an optional display name. Falls back to id when empty.
            description: AIModelConfig is a manually-added model entry under a provider.
        InstanceSetting_AIProviderConfig:
            type: object
            properties:
                id:
                    type: string
                title:
                    type: string
                type:
                    enum:
                        - AI_PROVIDER_TYPE_UNSPECIFIED
                        - OPENAI
                        - GEMINI
                    type: string
                    format: enum
                endpoint:
                    type: string
                apiKey:
                    writeOnly: true
                    type: string
                    description: api_key is write-only and is never returned by GetInstanceSetting.
                apiKeySet:
                    readOnly: true
                    type: boolean
                    description: api_key_set indicates whether an API key is stored for this provider.
                apiKeyHint:
                    readOnly: true
                    type: string
                    description: api_key_hint is a masked hint for the stored API key.
                models:
                    type: array
                    items:
                        $ref: '#/components/schemas/InstanceSetting_AIModelConfig'
                    description: models is the list of manually-added model IDs available for this provider.
            description: AIProviderConfig represents one callable AI provider connection.
        InstanceSetting_AISetting:
            type: object
            properties:
                providers:
                    type: array
                    items:
                        $ref: '#/components/schemas/InstanceSetting_AIProviderConfig'
                    description: providers is the list of AI provider configurations available instance-wide.
                transcription:
                    allOf:
                        - $ref: '#/components/schemas/InstanceSetting_TranscriptionConfig'
                    description: |-
                        transcription is the speech-to-text feature configuration.
                         When unset or transcription.provider_id is empty, transcription is disabled.
                defaultProviderId:
                    type: string
                    description: |-
                        default_provider_id references an entry in providers[].id. AI features that have
                         no feature-specific provider configuration of their own fall back to this provider.
                         Empty string means no default is set.
                formatPdfText:
                    type: boolean
                    description: |-
                        format_pdf_text enables running the extracted plain text of a PDF attachment through the
                         default AI provider to restructure it into Markdown when viewing the PDF's plain-text
                         panel. When disabled (the default), the raw extracted text is shown as-is (pages are still
                         separated), avoiding the slow, billable LLM call.
                embedding:
                    allOf:
                        - $ref: '#/components/schemas/InstanceSetting_EmbeddingConfig'
                    description: |-
                        embedding configures the text-embedding model used for semantic (vector) search.
                         When unset or embedding.provider_id is empty, semantic search is disabled and
                         search falls back to full-text (keyword) retrieval only.
            description: AI provider configuration settings.
        InstanceSetting_BackupSetting:
            type: object
            properties:
                pathTemplate:
                    type: string
                    description: |-
                        path_template is the S3 object key template for backup files, relative to the configured
                         bucket. Supports the same placeholders as StorageSetting.filepath_template ({timestamp},
                         {uuid}, {year}, {month}, {day}, {hour}, {minute}, {second}); there is no {filename}
                         placeholder since backups have no source filename.
                         e.g. backups/{timestamp}_{uuid}.db.gz
                lastBackupTime:
                    type: string
                    description: last_backup_time is when the most recent backup attempt finished.
                    format: date-time
                lastBackupSuccess:
                    type: boolean
                    description: last_backup_success indicates whether the most recent backup attempt succeeded.
                lastBackupError:
                    type: string
                    description: last_backup_error holds the error message when last_backup_success is false.
            description: |-
                BackupSetting configures and reports the status of the weekly/manual SQLite-to-S3 database
                 backup. This is instance-wide, admin-only. path_template is editable via UpdateInstanceSetting;
                 the last_backup_* fields are populated by the server after each run and are preserved
                 automatically when only path_template is updated.
        InstanceSetting_EmbeddingConfig:
            type: object
            properties:
                providerId:
                    type: string
                    description: |-
                        provider_id references an entry in AISetting.providers[].id.
                         Empty string means semantic search is disabled (keyword-only fallback).
                model:
                    type: string
                    description: |-
                        model is the provider-specific embedding model identifier.
                         OPENAI examples: text-embedding-3-small, text-embedding-3-large.
                         GEMINI examples: text-embedding-004.
                disabled:
                    type: boolean
                    description: |-
                        disabled turns off vector building and semantic retrieval while keeping the
                         provider/model selection above. Keyword (FTS) search is unaffected; re-enabling
                         triggers a full backfill of the missing vectors.
            description: EmbeddingConfig configures the text-embedding model used to power semantic search.
        InstanceSetting_GeneralSetting:
            type: object
            properties:
                disallowUserRegistration:
                    type: boolean
                    description: disallow_user_registration disallows user registration.
                disallowPasswordAuth:
                    type: boolean
                    description: disallow_password_auth disallows password authentication.
                additionalScript:
                    type: string
                    description: additional_script is the additional script.
                additionalStyle:
                    type: string
                    description: additional_style is the additional style.
                customProfile:
                    allOf:
                        - $ref: '#/components/schemas/GeneralSetting_CustomProfile'
                    description: custom_profile is the custom profile.
                weekStartDayOffset:
                    type: integer
                    description: |-
                        week_start_day_offset is the week start day offset from Sunday.
                         0: Sunday, 1: Monday, 2: Tuesday, 3: Wednesday, 4: Thursday, 5: Friday, 6: Saturday
                         Default is Sunday.
                    format: int32
                disallowChangeUsername:
                    type: boolean
                    description: disallow_change_username disallows changing username.
                disallowChangeNickname:
                    type: boolean
                    description: disallow_change_nickname disallows changing nickname.
            description: General instance settings configuration.
        InstanceSetting_MemoRelatedSetting:
            type: object
            properties:
                contentLengthLimit:
                    type: integer
                    description: content_length_limit is the limit of content length. Unit is byte.
                    format: int32
                enableDoubleClickEdit:
                    type: boolean
                    description: enable_double_click_edit enables editing on double click.
                reactions:
                    type: array
                    items:
                        type: string
                    description: reactions is the list of reactions.
            description: Memo-related instance settings and policies.
        InstanceSetting_NotificationSetting:
            type: object
            properties:
                email:
                    $ref: '#/components/schemas/NotificationSetting_EmailSetting'
            description: Notification transport configuration.
        InstanceSetting_StorageSetting:
            type: object
            properties:
                storageType:
                    enum:
                        - STORAGE_TYPE_UNSPECIFIED
                        - DATABASE
                        - LOCAL
                        - S3
                    type: string
                    description: storage_type is the storage type.
                    format: enum
                filepathTemplate:
                    type: string
                    description: |-
                        The template of file path.
                         e.g. assets/{timestamp}_{filename}
                uploadSizeLimitMb:
                    type: string
                    description: The max upload size in megabytes.
                s3Config:
                    allOf:
                        - $ref: '#/components/schemas/StorageSetting_S3Config'
                    description: The S3 config.
            description: Storage configuration settings for instance attachments.
        InstanceSetting_TagMetadata:
            type: object
            properties:
                backgroundColor:
                    allOf:
                        - $ref: '#/components/schemas/Color'
                    description: |-
                        Optional background color for the tag label.
                         When unset, the default tag color is used.
                blurContent:
                    type: boolean
                    description: Whether memos with this tag should have their content blurred.
            description: Metadata for a tag.
        InstanceSetting_TagsSetting:
            type: object
            properties:
                tags:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/InstanceSetting_TagMetadata'
                    description: |-
                        Map of tag name pattern to tag metadata.
                         Each key is treated as an anchored regular expression (^pattern$),
                         so a single entry like "project/.*" matches all tags under that prefix.
                         Exact tag names are also valid (they are trivially valid regex patterns).
            description: |-
                Tag metadata configuration.
                 Active tag metadata is stored in per-user tag settings.
                 This message remains for backward compatibility with existing clients and migrations.
        InstanceSetting_TranscriptionConfig:
            type: object
            properties:
                providerId:
                    type: string
                    description: |-
                        provider_id references an entry in AISetting.providers[].id.
                         Empty string means transcription is disabled.
                model:
                    type: string
                    description: |-
                        model is the provider-specific model identifier.
                         Empty string falls back to the engine default
                         (whisper-1 for OPENAI providers, gemini-2.5-flash for GEMINI providers).
                language:
                    type: string
                    description: |-
                        language is the default ISO 639-1 language hint sent to the provider.
                         Empty string lets the provider auto-detect.
                prompt:
                    type: string
                    description: prompt is a default spelling/vocabulary hint passed to the provider.
            description: TranscriptionConfig configures the speech-to-text feature.
        InstanceStats:
            type: object
            properties:
                database:
                    $ref: '#/components/schemas/InstanceStats_DatabaseStats'
                localStorageBytes:
                    type: string
                    description: Recursive size of the data directory in bytes. -1 if unavailable.
                generatedTime:
                    type: string
                    description: Server-side timestamp when the snapshot was generated.
                    format: date-time
            description: Resource usage statistics for the instance.
        InstanceStats_DatabaseStats:
            type: object
            properties:
                driver:
                    type: string
                    description: driver is the database driver in use; always "sqlite".
                sizeBytes:
                    type: string
                    description: size_bytes is the database size in bytes; -1 if unavailable.
            description: Database size statistics.
        LinkMetadata:
            type: object
            properties:
                url:
                    type: string
                    description: The original link URL.
                title:
                    type: string
                    description: The link title.
                description:
                    type: string
                    description: The link description.
                image:
                    type: string
                    description: The link image URL.
        LinkedIdentity:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the linked identity.
                         Format: users/{user}/linkedIdentities/{linked_identity}
                idpName:
                    readOnly: true
                    type: string
                    description: |-
                        The resource name of the identity provider.
                         Format: identity-providers/{uid}
                externUid:
                    readOnly: true
                    type: string
                    description: The external user identifier from the identity provider.
            description: LinkedIdentity represents an SSO identity linked to a user account.
        ListAllUserStatsResponse:
            type: object
            properties:
                stats:
                    type: array
                    items:
                        $ref: '#/components/schemas/UserStats'
                    description: The list of user statistics.
        ListAttachmentsResponse:
            type: object
            properties:
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
                    description: The list of attachments.
                nextPageToken:
                    type: string
                    description: |-
                        A token that can be sent as `page_token` to retrieve the next page.
                         If this field is omitted, there are no subsequent pages.
        ListIdentityProvidersResponse:
            type: object
            properties:
                identityProviders:
                    type: array
                    items:
                        $ref: '#/components/schemas/IdentityProvider'
                    description: The list of identity providers.
        ListLinkedIdentitiesResponse:
            type: object
            properties:
                linkedIdentities:
                    type: array
                    items:
                        $ref: '#/components/schemas/LinkedIdentity'
                    description: The list of linked identities.
        ListMemoAttachmentsResponse:
            type: object
            properties:
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
                    description: The list of attachments.
                nextPageToken:
                    type: string
                    description: A token for the next page of results.
        ListMemoCommentsResponse:
            type: object
            properties:
                memos:
                    type: array
                    items:
                        $ref: '#/components/schemas/Memo'
                    description: The list of comment memos.
                nextPageToken:
                    type: string
                    description: A token for the next page of results.
        ListMemoHistoriesResponse:
            type: object
            properties:
                memoHistories:
                    type: array
                    items:
                        $ref: '#/components/schemas/MemoHistory'
                    description: The list of versions, newest first.
        ListMemoPublicationsResponse:
            type: object
            properties:
                publications:
                    type: array
                    items:
                        $ref: '#/components/schemas/Publication'
                sites:
                    type: array
                    items:
                        $ref: '#/components/schemas/Site'
                    description: The sites each publication belongs to, in the same order.
        ListMemoReactionsResponse:
            type: object
            properties:
                reactions:
                    type: array
                    items:
                        $ref: '#/components/schemas/Reaction'
                    description: The list of reactions.
                nextPageToken:
                    type: string
                    description: A token for the next page of results.
        ListMemoRelationsResponse:
            type: object
            properties:
                relations:
                    type: array
                    items:
                        $ref: '#/components/schemas/MemoRelation'
                    description: The list of relations.
                nextPageToken:
                    type: string
                    description: A token for the next page of results.
        ListMemoSharesResponse:
            type: object
            properties:
                memoShares:
                    type: array
                    items:
                        $ref: '#/components/schemas/MemoShare'
                    description: The list of share links.
        ListMemosResponse:
            type: object
            properties:
                memos:
                    type: array
                    items:
                        $ref: '#/components/schemas/Memo'
                    description: The list of memos.
                nextPageToken:
                    type: string
                    description: |-
                        A token that can be sent as `page_token` to retrieve the next page.
                         If this field is omitted, there are no subsequent pages.
                subDocs:
                    type: array
                    items:
                        $ref: '#/components/schemas/Memo'
                    description: The sub-documents of the memos in `memos`, when `include_sub_docs` was set.
                subDocsIncluded:
                    type: boolean
                    description: |-
                        True when `include_sub_docs` was honoured. A server that predates the field
                         leaves it false, so a client can tell "no sub-documents" from "not asked".
        ListPersonalAccessTokensResponse:
            type: object
            properties:
                personalAccessTokens:
                    type: array
                    items:
                        $ref: '#/components/schemas/PersonalAccessToken'
                    description: The list of personal access tokens.
                nextPageToken:
                    type: string
                    description: A token for the next page of results.
        ListPublicPagesResponse:
            type: object
            properties:
                pages:
                    type: array
                    items:
                        $ref: '#/components/schemas/PublicPage'
                nextPageToken:
                    type: string
        ListPublicationsResponse:
            type: object
            properties:
                publications:
                    type: array
                    items:
                        $ref: '#/components/schemas/Publication'
        ListSecretBlocksResponse:
            type: object
            properties:
                secretBlocks:
                    type: array
                    items:
                        $ref: '#/components/schemas/SecretBlockSummary'
                    description: The caller's secret blocks, newest first. Metadata only — never ciphertext.
        ListShortcutsResponse:
            type: object
            properties:
                shortcuts:
                    type: array
                    items:
                        $ref: '#/components/schemas/Shortcut'
                    description: The list of shortcuts.
        ListSitesResponse:
            type: object
            properties:
                sites:
                    type: array
                    items:
                        $ref: '#/components/schemas/Site'
        ListUserNotificationsResponse:
            type: object
            properties:
                notifications:
                    type: array
                    items:
                        $ref: '#/components/schemas/UserNotification'
                nextPageToken:
                    type: string
        ListUserSettingsResponse:
            type: object
            properties:
                settings:
                    type: array
                    items:
                        $ref: '#/components/schemas/UserSetting'
                    description: The list of user settings.
                nextPageToken:
                    type: string
                    description: |-
                        A token that can be sent as `page_token` to retrieve the next page.
                         If this field is omitted, there are no subsequent pages.
            description: Response message for ListUserSettings method.
        ListUserWebhooksResponse:
            type: object
            properties:
                webhooks:
                    type: array
                    items:
                        $ref: '#/components/schemas/UserWebhook'
                    description: The list of webhooks.
        ListUsersResponse:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/User'
                    description: The list of users.
                nextPageToken:
                    type: string
                    description: |-
                        A token that can be sent as `page_token` to retrieve the next page.
                         If this field is omitted, there are no subsequent pages.
        ListWorkspaceGrantsResponse:
            type: object
            properties:
                grants:
                    type: array
                    items:
                        $ref: '#/components/schemas/WorkspaceGrant'
        ListWorkspacesResponse:
            type: object
            properties:
                workspaces:
                    type: array
                    items:
                        $ref: '#/components/schemas/Workspace'
        Location:
            type: object
            properties:
                placeholder:
                    type: string
                    description: A placeholder text for the location.
                latitude:
                    type: number
                    description: The latitude of the location.
                    format: double
                longitude:
                    type: number
                    description: The longitude of the location.
                    format: double
        Memo:
            required:
                - state
                - content
                - visibility
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the memo.
                         Format: memos/{memo}, memo is the user defined id or uuid.
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - NORMAL
                        - ARCHIVED
                    type: string
                    description: The state of the memo.
                    format: enum
                creator:
                    readOnly: true
                    type: string
                    description: |-
                        The name of the creator.
                         Format: users/{user}
                createTime:
                    type: string
                    description: |-
                        The creation timestamp.
                         If not set on creation, the server will set it to the current time.
                    format: date-time
                updateTime:
                    type: string
                    description: |-
                        The last update timestamp.
                         If not set on creation, the server will set it to the current time.
                    format: date-time
                content:
                    type: string
                    description: Required. The content of the memo in Markdown format.
                visibility:
                    enum:
                        - VISIBILITY_UNSPECIFIED
                        - PRIVATE
                        - PROTECTED
                        - PUBLIC
                    type: string
                    description: |-
                        The visibility of the memo.
                         One of PRIVATE (creator only), PROTECTED (signed-in users), or
                         PUBLIC (anyone). Defaults to PRIVATE on creation when unspecified.
                    format: enum
                tags:
                    readOnly: true
                    type: array
                    items:
                        type: string
                    description: Output only. The tags extracted from the content.
                pinned:
                    type: boolean
                    description: Whether the memo is pinned.
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
                    description: Optional. The attachments of the memo.
                relations:
                    type: array
                    items:
                        $ref: '#/components/schemas/MemoRelation'
                    description: Optional. The relations of the memo.
                reactions:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/Reaction'
                    description: Output only. The reactions to the memo.
                property:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/Memo_Property'
                    description: Output only. The computed properties of the memo.
                parent:
                    readOnly: true
                    type: string
                    description: |-
                        Output only. The name of the parent memo.
                         Format: memos/{memo}
                snippet:
                    readOnly: true
                    type: string
                    description: Output only. The snippet of the memo content. Plain text only.
                location:
                    allOf:
                        - $ref: '#/components/schemas/Location'
                    description: Optional. The location of the memo.
                workspace:
                    type: string
                    description: |-
                        The workspace (knowledge base) this memo belongs to.
                         Format: workspaces/{workspace}
                         Optional on create: defaults to the caller's default workspace.
                folderPath:
                    type: string
                    description: |-
                        Optional. The slash-separated folder path (relative to the workspace root)
                         this memo lives under. Empty string means the workspace root.
                title:
                    type: string
                    description: |-
                        Optional. The document's display title (its "filename"). If unset on
                         creation, it is derived from the first H1 heading for Markdown documents.
                docType:
                    enum:
                        - DOC_TYPE_UNSPECIFIED
                        - MARKDOWN
                        - HTML
                        - PDF
                        - VIEW
                        - BLOGVIEW
                    type: string
                    description: Optional. The document type. Defaults to MARKDOWN.
                    format: enum
                pdfAnnotation:
                    allOf:
                        - $ref: '#/components/schemas/PdfAnnotation'
                    description: |-
                        Optional. Set when this memo is a comment anchored to a location within
                         a PDF attachment.
                docAnchor:
                    allOf:
                        - $ref: '#/components/schemas/DocAnchor'
                    description: |-
                        Optional. Set when this memo is a comment anchored to a heading within a
                         document memo (markdown/view).
                epubAnnotation:
                    allOf:
                        - $ref: '#/components/schemas/EpubAnnotation'
                    description: |-
                        Optional. Set when this memo is a comment anchored to a text range within
                         an EPUB attachment.
                nodeOverlays:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Optional. Supplementary per-node data keyed by an in-document node anchor id
                         (e.g. a `sheets` block's `id:`). The value is an opaque JSON string whose
                         shape is owned by the node's renderer; the server never parses it. Lets
                         clients attach overlay info (cell styles, etc.) to any addressable node
                         without touching that node's raw content.
                docConfig:
                    allOf:
                        - $ref: '#/components/schemas/DocConfig'
                    description: |-
                        Optional. How this document is framed by the app (body width, outline,
                         folder tree, properties panel). This is view configuration, not document
                         content: it is stored alongside the memo rather than in its frontmatter, so
                         changing it neither rewrites the document nor shows up in a memogit export.
                agentEditPending:
                    readOnly: true
                    type: boolean
                    description: |-
                        Output only. An MCP edit is waiting to be seen in the document editor.
                         Opening the editor acknowledges it without changing the document content.
                icon:
                    type: string
                    description: |-
                        Optional. The document's icon: a single system emoji. Empty means the
                         doc-type default icon. Set with update_mask "icon"; clearing it restores
                         the default.
        MemoHistory:
            type: object
            properties:
                name:
                    type: string
                    description: 'The resource name of the history record. Format: memos/{memo}/histories/{history}'
                displayName:
                    type: string
                    description: Optional. The user-supplied version name.
                title:
                    readOnly: true
                    type: string
                    description: Output only. The memo title at snapshot time.
                content:
                    type: string
                    description: The full memo content at snapshot time. Required on create.
                contentHash:
                    readOnly: true
                    type: string
                    description: Output only. The SHA-256 hex digest of the snapshot content + attachment set.
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. When this version was created.
                    format: date-time
                attachments:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/MemoHistory_Attachment'
                    description: Output only. The attachment set captured at snapshot time.
                source:
                    readOnly: true
                    enum:
                        - SOURCE_UNSPECIFIED
                        - MANUAL
                        - AUTO
                        - AGENT_BASELINE
                    type: string
                    description: |-
                        Output only. What produced this version. Set by the server; a client
                         creating a version always gets MANUAL.
                    format: enum
            description: MemoHistory is a snapshot (version) of a memo's content.
        MemoHistory_Attachment:
            type: object
            properties:
                uid:
                    type: string
                    description: The attachment UID.
                filename:
                    type: string
                    description: The attachment filename.
                type:
                    type: string
                    description: The MIME type of the attachment.
            description: A lightweight reference to an attachment captured in a version snapshot.
        MemoRelation:
            required:
                - memo
                - relatedMemo
                - type
            type: object
            properties:
                memo:
                    allOf:
                        - $ref: '#/components/schemas/MemoRelation_Memo'
                    description: The memo in the relation.
                relatedMemo:
                    allOf:
                        - $ref: '#/components/schemas/MemoRelation_Memo'
                    description: The related memo.
                type:
                    enum:
                        - TYPE_UNSPECIFIED
                        - REFERENCE
                        - COMMENT
                    type: string
                    format: enum
        MemoRelation_Memo:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the memo.
                         Format: memos/{memo}
                snippet:
                    readOnly: true
                    type: string
                    description: Output only. The snippet of the memo content. Plain text only.
            description: Memo reference in relations.
        MemoShare:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the share. Format: memos/{memo}/shares/{share}
                         The {share} segment is the opaque token used in the share URL.
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. When this share link was created.
                    format: date-time
                expireTime:
                    type: string
                    description: |-
                        Optional. When set, the share link stops working after this time.
                         If unset, the link never expires.
                    format: date-time
            description: MemoShare is an access grant that permits read-only access to a memo via an opaque bearer token.
        Memo_Property:
            type: object
            properties:
                hasLink:
                    type: boolean
                hasTaskList:
                    type: boolean
                hasCode:
                    type: boolean
                hasIncompleteTasks:
                    type: boolean
                title:
                    type: string
                    description: The title extracted from the first H1 heading, if present.
            description: Computed properties of a memo.
        MotionMedia:
            type: object
            properties:
                family:
                    enum:
                        - MOTION_MEDIA_FAMILY_UNSPECIFIED
                        - APPLE_LIVE_PHOTO
                        - ANDROID_MOTION_PHOTO
                    type: string
                    format: enum
                role:
                    enum:
                        - MOTION_MEDIA_ROLE_UNSPECIFIED
                        - STILL
                        - VIDEO
                        - CONTAINER
                    type: string
                    format: enum
                groupId:
                    type: string
                presentationTimestampUs:
                    type: string
                hasEmbeddedVideo:
                    type: boolean
        MoveWorkspaceFolderRequest:
            required:
                - parent
                - path
                - destinationWorkspace
            type: object
            properties:
                parent:
                    type: string
                    description: |-
                        Required. The workspace the folder currently lives in.
                         Format: workspaces/{workspace}
                path:
                    type: string
                    description: Required. The folder path to move, relative to the source workspace root.
                destinationWorkspace:
                    type: string
                    description: |-
                        Required. The workspace to move the folder into.
                         Format: workspaces/{workspace}
                destinationFolderPath:
                    type: string
                    description: |-
                        Optional. The destination parent folder within destination_workspace. Empty
                         means the destination workspace's root. The moved folder keeps its own name,
                         so it ends up at "{destination_folder_path}/{name}".
        MoveWorkspaceFolderResponse:
            type: object
            properties:
                newPath:
                    type: string
                    description: The folder's new path within the destination workspace.
                movedDocumentCount:
                    type: integer
                    description: How many documents were moved.
                    format: int32
        NotificationSetting_EmailSetting:
            type: object
            properties:
                enabled:
                    type: boolean
                smtpHost:
                    type: string
                smtpPort:
                    type: integer
                    format: int32
                smtpUsername:
                    type: string
                smtpPassword:
                    writeOnly: true
                    type: string
                fromEmail:
                    type: string
                fromName:
                    type: string
                replyTo:
                    type: string
                useTls:
                    type: boolean
                useSsl:
                    type: boolean
            description: Email delivery configuration for notifications.
        OAuth2Config:
            type: object
            properties:
                clientId:
                    type: string
                clientSecret:
                    type: string
                authUrl:
                    type: string
                tokenUrl:
                    type: string
                userInfoUrl:
                    type: string
                scopes:
                    type: array
                    items:
                        type: string
                fieldMapping:
                    $ref: '#/components/schemas/FieldMapping'
        PdfAnnotation:
            required:
                - attachmentName
                - page
                - x
                - y
                - width
                - height
            type: object
            properties:
                attachmentName:
                    type: string
                    description: |-
                        The name of the attachment this annotation is anchored to.
                         Format: attachments/{uid}
                page:
                    type: integer
                    description: 1-based page number.
                    format: int32
                x:
                    type: number
                    description: |-
                        Normalized (0~1) rect relative to the unrotated page dimensions. Always set, so
                         an annotation whose text anchor cannot be resolved still has somewhere to draw.
                    format: double
                y:
                    type: number
                    format: double
                width:
                    type: number
                    format: double
                height:
                    type: number
                    format: double
                textSnippet:
                    type: string
                    description: Optional selected text snippet, used as a fallback anchor if the rect drifts.
                textExact:
                    type: string
                    description: |-
                        The exact marked text, as it appeared in the page's rendered text layer. Empty
                         means this annotation has no text-level anchor and draws from the rect alone.
                textPrefix:
                    type: string
                    description: |-
                        The rendered text immediately before / after `text_exact` (a bounded window),
                         used to pick the right occurrence when the same phrase repeats on the page.

                         Unlike a document's markdown, a PDF's text never changes under the reader, so
                         these are not needed to survive edits — they are reused verbatim from DocAnchor
                         so both readers share one anchoring implementation.
                textSuffix:
                    type: string
                color:
                    type: string
                    description: |-
                        The mark's color, as a preset key (e.g. "yellow", "blue"). Empty means no fill
                         (an underline-only mark).
                underline:
                    type: boolean
                    description: |-
                        When true the mark renders as an underline in `color`; otherwise as a background
                         highlight. Ignored when `text_exact` is empty.
            description: |-
                Anchors a comment to a location inside a PDF attachment. Two kinds of anchor
                 coexist, mirroring DocAnchor's two levels:

                 The text_* fields pin an exact span of the page's rendered text layer, so the
                 comment draws as an in-text mark (highlight or underline) that follows the text
                 across zoom and page-fit changes. They are the preferred anchor and are set for
                 every mark made by selecting text.

                 The normalized rect is the fallback, and the only anchor available for PDFs with
                 no text layer at all (scanned/image-only documents), where text cannot be selected.
        PersonalAccessToken:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the personal access token.
                         Format: users/{user}/personalAccessTokens/{personal_access_token}
                description:
                    type: string
                    description: The description of the token.
                createdAt:
                    readOnly: true
                    type: string
                    description: Output only. The creation timestamp.
                    format: date-time
                expiresAt:
                    type: string
                    description: Optional. The expiration timestamp.
                    format: date-time
                lastUsedAt:
                    readOnly: true
                    type: string
                    description: Output only. The last used timestamp.
                    format: date-time
            description: |-
                PersonalAccessToken represents a long-lived token for API/script access.
                 PATs are distinct from short-lived JWT access tokens used for session authentication.
        PolishTextRequest:
            required:
                - text
            type: object
            properties:
                text:
                    type: string
                    description: Required. The selected text to rewrite.
                instruction:
                    type: string
                    description: |-
                        Optional. A custom instruction describing how to rewrite the text
                         (e.g. "make it more formal", "cut the length in half"). When empty,
                         the preset field is used.
                preset:
                    type: string
                    description: |-
                        Optional. A named preset action, used when instruction is empty.
                         One of: "polish", "concise", "expand", "grammar", "tone".
        PolishTextResponse:
            type: object
            properties:
                text:
                    type: string
                    description: The rewritten text.
        PreviewPublishRequest:
            required:
                - parent
                - memo
            type: object
            properties:
                parent:
                    type: string
                    description: 'Format: sites/{site}'
                memo:
                    type: string
                    description: 'The document to publish. Format: memos/{memo}'
        PreviewPublishResponse:
            type: object
            properties:
                attachmentsNotPublic:
                    type: array
                    items:
                        $ref: '#/components/schemas/AttachmentNotice'
                    description: |-
                        Attachments the document pulls in that are not public yet. Publishing does
                         not touch attachment permissions, so these are reported for the author to
                         act on: either make the file public themselves, or take it out of the page.
                blockers:
                    type: array
                    items:
                        $ref: '#/components/schemas/PublishBlocker'
                    description: Problems that block publishing. Empty means the publish would go through.
                secretBlocksRemoved:
                    type: integer
                    description: How many secret blocks would be dropped from the snapshot.
                    format: int32
                proposedSlug:
                    type: string
                    description: |-
                        The slug the page would get. Empty when the document is already published
                         here, since an existing slug is never regenerated.
                viewBlocksDropped:
                    type: integer
                    description: |-
                        For a `.view` home page: how many blocks would not appear on the site.
                         A gallery or calendar block belongs to the knowledge base and is stripped
                         from the snapshot, so the author is told here rather than left to notice a
                         section missing from the live page.
                    format: int32
        PublicPage:
            type: object
            properties:
                slug:
                    type: string
                title:
                    type: string
                summary:
                    type: string
                content:
                    type: string
                    description: The snapshot body. Omitted from list responses.
                tags:
                    type: array
                    items:
                        type: string
                updateTime:
                    type: string
                    description: |-
                        When the snapshot was last refreshed. This is the "last updated" shown at
                         the foot of a page.
                    format: date-time
                docId:
                    type: string
                    description: The document id backing the permanent short link /d/{doc_id}.
                coverUrl:
                    type: string
                    description: |-
                        The card image, resolved when the snapshot was taken. Resolving it at read
                         time would let an edit of the source document change what a published card
                         shows, which is the one thing a snapshot exists to prevent.
            description: |-
                PublicPage is a published page as an anonymous reader sees it: the frozen
                 snapshot, with no author account, comment, history or internal metadata
                 attached. Fields are added here by whitelist — missing one field shows less,
                 while leaking one is a disclosure.
        PublicSiteProfile:
            type: object
            properties:
                displayName:
                    type: string
                description:
                    type: string
                theme:
                    type: string
                    description: Theme configuration as JSON.
                dashboardContent:
                    type: string
                    description: |-
                        The site's home page layout: the sanitized block JSON of the `.view`
                         document chosen as the home page, empty when none is. It is served inline
                         rather than as a page the reader fetches by slug, because a home page is
                         not a page of the site: it has no URL of its own, is not in the contents,
                         and must never turn up in a listing next to the articles.
                menu:
                    type: array
                    items:
                        $ref: '#/components/schemas/SiteMenuItem'
                    description: |-
                        The top menu, in the order it is drawn. It is served with the profile
                         rather than read off the home page document because it renders on every
                         page of the site, most of which never load that document.
                authorName:
                    type: string
                    description: |-
                        The byline shown on every page of this site, already resolved: the site's
                         author name when one is set, otherwise its display name. Resolving it here
                         keeps every reader-facing surface agreeing on one answer.
                nav:
                    type: array
                    items:
                        $ref: '#/components/schemas/SiteNavItem'
                    description: |-
                        The navigation tree for the contents page, already pruned to what is
                         published: a node pointing at a page that is not published on this site is
                         not served at all. Pruning here rather than in the client is what keeps the
                         tree from telling an anonymous reader that an unpublished document exists.
            description: PublicSiteProfile is what an anonymous reader may know about a site.
        Publication:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the publication.
                         Format: sites/{site}/publications/{publication}
                memo:
                    readOnly: true
                    type: string
                    description: 'The source document. Format: memos/{memo}'
                slug:
                    type: string
                    description: |-
                        The page's path under the site. Generated once on first publish and frozen
                         afterwards; an author may still change it by hand.
                title:
                    readOnly: true
                    type: string
                summary:
                    readOnly: true
                    type: string
                content:
                    readOnly: true
                    type: string
                    description: The snapshot body. Omitted from list responses.
                tags:
                    readOnly: true
                    type: array
                    items:
                        type: string
                    description: Outward-facing tags carried by the snapshot.
                state:
                    readOnly: true
                    enum:
                        - PUBLICATION_STATE_UNSPECIFIED
                        - PUBLISHED
                        - UNPUBLISHED
                        - PENDING
                    type: string
                    format: enum
                publisher:
                    readOnly: true
                    type: string
                    description: 'Who published this snapshot. Format: users/{user}'
                publishTime:
                    readOnly: true
                    type: string
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    format: date-time
                outdated:
                    readOnly: true
                    type: boolean
                    description: |-
                        Whether the source document has been edited since this snapshot was taken.
                         Readers keep seeing the snapshot until the author explicitly republishes, so
                         without this the author has no way to tell that their edit is not live.
            description: |-
                Publication is one read-only snapshot: the publish pipeline's output for one
                 document on one site.
        PublishBlocker:
            type: object
            properties:
                type:
                    enum:
                        - BLOCKER_TYPE_UNSPECIFIED
                        - UNPUBLISHED_REFERENCE
                        - PRIVATE_ATTACHMENT
                        - INVALID_HOME_LAYOUT
                    type: string
                    format: enum
                reference:
                    type: string
                    description: The reference that caused it — a link href, or an attachment filename.
                detail:
                    type: string
                    description: A human-readable explanation.
            description: |-
                PublishBlocker is one reason a publish cannot go through. Blockers name the
                 exact offending reference: an author who is told only "there is a problem"
                 cannot fix it.
        PublishMemoRequest:
            required:
                - parent
                - memo
            type: object
            properties:
                parent:
                    type: string
                    description: 'Format: sites/{site}'
                memo:
                    type: string
                    description: 'The document to publish. Format: memos/{memo}'
        Reaction:
            required:
                - contentId
                - reactionType
            type: object
            properties:
                name:
                    readOnly: true
                    type: string
                    description: |-
                        The resource name of the reaction.
                         Format: memos/{memo}/reactions/{reaction}
                creator:
                    readOnly: true
                    type: string
                    description: |-
                        The resource name of the creator.
                         Format: users/{user}
                contentId:
                    type: string
                    description: |-
                        The resource name of the content.
                         For memo reactions, this should be the memo's resource name.
                         Format: memos/{memo}
                reactionType:
                    type: string
                    description: "Required. The type of reaction (e.g., \"\U0001F44D\", \"❤️\", \"\U0001F604\")."
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. The creation timestamp.
                    format: date-time
        RebuildIndexRequest:
            type: object
            properties: {}
        RebuildIndexResponse:
            type: object
            properties:
                enqueued:
                    type: integer
                    description: Number of memos enqueued for reindexing.
                    format: int32
        RefreshTokenRequest:
            type: object
            properties: {}
        RefreshTokenResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    description: The new short-lived access token.
                expiresAt:
                    type: string
                    description: When the access token expires.
                    format: date-time
        RenameWorkspaceFolderRequest:
            required:
                - parent
                - oldPath
                - newPath
            type: object
            properties:
                parent:
                    type: string
                    description: 'Required. Format: workspaces/{workspace}'
                oldPath:
                    type: string
                    description: Required. The current folder path.
                newPath:
                    type: string
                    description: Required. The new folder path.
        RequestSecretBlockUnlockRequest:
            required:
                - name
                - confirmText
            type: object
            properties:
                name:
                    type: string
                    description: 'Required. Format: secretBlocks/{secret_block}'
                confirmText:
                    type: string
                    description: Required. The policy's confirm_text, typed by hand.
                emergency:
                    type: boolean
                    description: |-
                        Skip the wait. Only for presets with an emergency quota, and only while the
                         quota lasts. Requires emergency_text and emergency_reason.
                emergencyText:
                    type: string
                    description: The fixed emergency statement, typed by hand.
                emergencyReason:
                    type: string
                    description: Why this cannot wait. Kept and shown on the block afterwards.
        ResolvePublicDocResponse:
            type: object
            properties:
                slug:
                    type: string
        RestoreMemoHistoryRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Required. The resource name of the version to restore.
                         Format: memos/{memo}/histories/{history}
        SearchHit:
            type: object
            properties:
                memo:
                    type: string
                    description: 'The memo resource name. Format: memos/{memo}'
                title:
                    type: string
                    description: The memo's user-facing title.
                workspace:
                    type: string
                    description: 'The workspace resource name the memo belongs to. Format: workspaces/{workspace}'
                folderPath:
                    type: string
                    description: The memo's folder path within its workspace.
                score:
                    type: number
                    description: Fused relevance score (higher is more relevant).
                    format: double
                snippet:
                    type: string
                    description: Best-matching snippet of the memo's content.
                highlights:
                    type: array
                    items:
                        type: string
                    description: Substrings within the snippet that matched the query, for client-side highlighting.
                icon:
                    type: string
                    description: The memo's emoji icon, empty for the doc-type default.
        SearchPublicPagesResponse:
            type: object
            properties:
                pages:
                    type: array
                    items:
                        $ref: '#/components/schemas/PublicPage'
                    description: |-
                        Matching pages, without bodies. Ordered newest first, same as the feed:
                         substring matching carries no relevance score to order by.
        SearchRequest:
            required:
                - query
            type: object
            properties:
                query:
                    type: string
                    description: Required. The search query.
                global:
                    type: boolean
                    description: Search across all workspaces the user can access.
                workspace:
                    type: string
                    description: |-
                        Restrict search to a single workspace, identified by its resource name.
                         Format: workspaces/{workspace}
                mode:
                    enum:
                        - SEARCH_MODE_UNSPECIFIED
                        - SEARCH_MODE_MIXED
                        - SEARCH_MODE_KEYWORD
                        - SEARCH_MODE_SEMANTIC
                        - SEARCH_MODE_LIKE
                    type: string
                    description: Optional. Retrieval mode. Unspecified falls back to the user's configured mode.
                    format: enum
                limit:
                    type: integer
                    description: Optional. Max documents to return. Zero falls back to the user's configured limit.
                    format: int32
                filter:
                    type: string
                    description: |-
                        Optional. A CEL filter (same grammar as ListMemos.filter) that constrains the
                         candidate document set BEFORE ranking. Structured conditions (workspace, tag,
                         visibility, time, doc_type, …) define the corpus; the query then ranks within it.
                         The keyword itself must NOT be encoded here as content.contains — pass it as `query`
                         so semantic recall isn't lost. Permission scoping is always applied on top.
        SearchResponse:
            type: object
            properties:
                hits:
                    type: array
                    items:
                        $ref: '#/components/schemas/SearchHit'
                effectiveMode:
                    enum:
                        - SEARCH_MODE_UNSPECIFIED
                        - SEARCH_MODE_MIXED
                        - SEARCH_MODE_KEYWORD
                        - SEARCH_MODE_SEMANTIC
                        - SEARCH_MODE_LIKE
                    type: string
                    description: The mode actually applied (may be downgraded to KEYWORD when no embedding model is configured).
                    format: enum
        SecretBlock:
            required:
                - envelope
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the secret block.
                         Format: secretBlocks/{secret_block}
                hint:
                    type: string
                    description: |-
                        A user-authored label for which passphrase unlocks this block (e.g.
                         "minio-prod"). Stored and displayed in clear text — it is a reminder, not a
                         secret, and it is what makes one passphrase usable across several blocks.
                envelope:
                    allOf:
                        - $ref: '#/components/schemas/SecretEnvelope'
                    description: The client-encrypted payload.
                createTime:
                    readOnly: true
                    type: string
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    format: date-time
                restriction:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/SecretBlockRestriction'
                    description: Present only for a restricted block. See SecretBlockRestriction.
        SecretBlockPendingPolicyChange:
            type: object
            properties:
                policy:
                    allOf:
                        - $ref: '#/components/schemas/SecretBlockPolicy'
                    description: The policy that will apply. Unset means the restriction will be lifted.
                effectiveTime:
                    type: string
                    format: date-time
        SecretBlockPolicy:
            required:
                - preset
                - timeZone
                - confirmText
            type: object
            properties:
                preset:
                    enum:
                        - PRESET_UNSPECIFIED
                        - LOW_IMPACT
                        - HIGH_IMPACT
                    type: string
                    format: enum
                timeZone:
                    type: string
                    description: |-
                        IANA time zone the wall-clock times below are read in (e.g. "Asia/Shanghai").
                         Stored with the policy rather than taken from the server process, whose zone
                         is often UTC in a container.
                prompt:
                    type: string
                    description: 'Shown before every unlock request: a note from the owner to their future self.'
                confirmText:
                    type: string
                    description: |-
                        Must be typed verbatim (modulo surrounding and repeated whitespace) to request
                         an unlock. Not a secret.
                workStartMinute:
                    readOnly: true
                    type: integer
                    description: |-
                        Working hours as minutes after local midnight, [start, end). Both zero when
                         the preset has no working-hours fast path.
                    format: int32
                workEndMinute:
                    readOnly: true
                    type: integer
                    format: int32
                workDelaySeconds:
                    readOnly: true
                    type: integer
                    description: Wait for a request made inside working hours.
                    format: int32
                releaseMinute:
                    readOnly: true
                    type: integer
                    description: |-
                        Local minute of day a request made outside working hours opens at: the first
                         such time strictly after the request.
                    format: int32
                emergencyQuota:
                    readOnly: true
                    type: integer
                    description: Emergency unlocks allowed per rolling window. Zero means no emergency path.
                    format: int32
                emergencyWindowDays:
                    readOnly: true
                    type: integer
                    format: int32
                viewSeconds:
                    readOnly: true
                    type: integer
                    description: How long the envelope is served once first fetched.
                    format: int32
                readyTtlSeconds:
                    readOnly: true
                    type: integer
                    description: How long an available but unviewed request stays available.
                    format: int32
            description: |-
                SecretBlockPolicy is the time gate in front of a restricted block. It guards
                 against the owner's own impulses (the 1 a.m. "I'll just unlock it now"), not
                 against an attacker: the gate is enforced by the server so that skipping it
                 costs more than waiting, but an administrator can always bypass it.

                 Clients choose a preset and write the two texts; every number is filled in by
                 the server from the preset and returned for display.
        SecretBlockRestriction:
            type: object
            properties:
                policy:
                    $ref: '#/components/schemas/SecretBlockPolicy'
                unlockState:
                    enum:
                        - UNLOCK_STATE_UNSPECIFIED
                        - LOCKED
                        - PENDING
                        - READY
                        - OPEN
                    type: string
                    format: enum
                emergency:
                    type: boolean
                    description: Whether the live request (if any) came through the emergency path.
                availableTime:
                    type: string
                    description: 'PENDING: when the block opens.'
                    format: date-time
                expireTime:
                    type: string
                    description: 'READY: when an unviewed request lapses. OPEN: when the viewing window ends.'
                    format: date-time
                emergencyRemaining:
                    type: integer
                    description: Emergency unlocks left in the current window.
                    format: int32
                nextEmergencyTime:
                    type: string
                    description: When the next emergency unlock frees up, if none remain.
                    format: date-time
                lastEmergencyTime:
                    type: string
                    description: The most recent emergency unlock, kept visible so it is seen the morning after.
                    format: date-time
                lastEmergencyReason:
                    type: string
                pendingChange:
                    allOf:
                        - $ref: '#/components/schemas/SecretBlockPendingPolicyChange'
                    description: A scheduled policy change, if any.
            description: |-
                SecretBlockRestriction is a restricted block's policy and where it currently
                 stands. All times come from the server clock.
        SecretBlockSummary:
            type: object
            properties:
                name:
                    type: string
                    description: 'Format: secretBlocks/{secret_block}'
                hint:
                    type: string
                ciphertextSize:
                    readOnly: true
                    type: string
                    description: |-
                        Byte length of the stored ciphertext, so the management UI can show a size
                         without transferring the ciphertext itself.
                createTime:
                    readOnly: true
                    type: string
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    format: date-time
                restriction:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/SecretBlockRestriction'
                    description: Present only for a restricted block.
            description: |-
                SecretBlockSummary is SecretBlock without the envelope. It is a separate message
                 rather than a partially-populated SecretBlock so that no future edit to the list
                 handler can accidentally start returning ciphertext.
        SecretEnvelope:
            required:
                - kdf
                - kdfIterations
                - cipher
                - salt
                - nonce
                - verifier
                - ciphertext
            type: object
            properties:
                kdf:
                    type: string
                    description: |-
                        The key derivation function. Currently always "pbkdf2-sha256".

                         Stored per record rather than assumed, so a future suite (argon2id) can be
                         introduced without migrating existing records: each envelope is decrypted
                         with the parameters it was written with.
                kdfIterations:
                    type: integer
                    description: Iteration count for the KDF.
                    format: int32
                cipher:
                    type: string
                    description: The AEAD cipher. Currently always "aes-256-gcm".
                salt:
                    type: string
                    description: Base64 KDF salt.
                nonce:
                    type: string
                    description: Base64 AEAD nonce.
                verifier:
                    type: string
                    description: |-
                        Base64 HMAC over the canonical parameter header, keyed by a passphrase-derived
                         MAC key. Lets the client tell a wrong passphrase from a corrupted ciphertext:
                         AEAD authentication failure alone cannot distinguish the two, and a user who
                         hit corruption needs to know to go find a backup instead of retrying passwords.
                ciphertext:
                    type: string
                    description: Base64 AEAD ciphertext, with the authentication tag appended.
            description: |-
                SecretEnvelope is everything needed to decrypt a secret given the passphrase,
                 and nothing that helps without it. The server treats every field as opaque.
        SetMemoAttachmentsRequest:
            required:
                - name
                - attachments
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Required. The resource name of the memo.
                         Format: memos/{memo}
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
                    description: Required. The attachments to set for the memo.
        SetMemoRelationsRequest:
            required:
                - name
                - relations
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Required. The resource name of the memo.
                         Format: memos/{memo}
                relations:
                    type: array
                    items:
                        $ref: '#/components/schemas/MemoRelation'
                    description: Required. The relations to set for the memo.
        Shortcut:
            required:
                - title
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the shortcut.
                         Format: users/{username}/shortcuts/{shortcut}
                title:
                    type: string
                    description: The title of the shortcut.
                filter:
                    type: string
                    description: |-
                        The CEL filter expression for the shortcut, using the same grammar as the
                         ListMemos `filter` argument. Reuse it by passing this value to ListMemos.
        SignInRequest:
            type: object
            properties:
                passwordCredentials:
                    allOf:
                        - $ref: '#/components/schemas/SignInRequest_PasswordCredentials'
                    description: Username and password authentication.
                ssoCredentials:
                    allOf:
                        - $ref: '#/components/schemas/SignInRequest_SSOCredentials'
                    description: SSO provider authentication.
        SignInRequest_PasswordCredentials:
            required:
                - username
                - password
            type: object
            properties:
                username:
                    type: string
                    description: The username to sign in with.
                password:
                    type: string
                    description: The password to sign in with.
            description: Nested message for password-based authentication credentials.
        SignInRequest_SSOCredentials:
            required:
                - idpName
                - code
                - redirectUri
            type: object
            properties:
                idpName:
                    type: string
                    description: |-
                        The resource name of the SSO provider.
                         Format: identity-providers/{uid}
                code:
                    type: string
                    description: The authorization code from the SSO provider.
                redirectUri:
                    type: string
                    description: The redirect URI used in the SSO flow.
                codeVerifier:
                    type: string
                    description: |-
                        The PKCE code verifier for enhanced security (RFC 7636).
                         Optional - enables PKCE flow protection against authorization code interception.
            description: Nested message for SSO authentication credentials.
        SignInResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The authenticated user's information.
                accessToken:
                    type: string
                    description: |-
                        The short-lived access token for API requests.
                         Store in memory only, not in localStorage.
                accessTokenExpiresAt:
                    type: string
                    description: |-
                        When the access token expires.
                         Client should call RefreshToken before this time.
                    format: date-time
        Site:
            type: object
            properties:
                name:
                    type: string
                    description: 'The resource name of the site. Format: sites/{site}'
                displayName:
                    type: string
                    description: The site's display name.
                description:
                    type: string
                    description: A short description shown on the site.
                domain:
                    type: string
                    description: The custom domain bound to the site, empty when none is bound.
                domainVerified:
                    readOnly: true
                    type: boolean
                    description: Whether ownership of the domain has been verified.
                canonical:
                    enum:
                        - SITE_CANONICAL_UNSPECIFIED
                        - PLATFORM
                        - DOMAIN
                    type: string
                    description: Which of the two entry points search engines should treat as canonical.
                    format: enum
                status:
                    enum:
                        - SITE_STATUS_UNSPECIFIED
                        - DRAFT
                        - ONLINE
                        - OFFLINE
                    type: string
                    description: |-
                        The site's own online switch. A site is only readable by anonymous visitors
                         while it is ONLINE, independent of whether the instance allows anonymous
                         access to the main application.
                    format: enum
                dashboard:
                    type: string
                    description: |-
                        The `.view` document rendered at the site root.
                         Format: memos/{memo}
                theme:
                    type: string
                    description: |-
                        Theme configuration as JSON. Restricted to known configuration keys — no
                         raw HTML or scripts.
                menu:
                    type: array
                    items:
                        $ref: '#/components/schemas/SiteMenuItem'
                    description: |-
                        The site's top menu, in the order it is drawn. Authored, not derived from
                         the content: a menu inferred from what happens to be published is always a
                         little off, and this is the first thing a reader sees.
                nav:
                    type: array
                    items:
                        $ref: '#/components/schemas/SiteNavItem'
                    description: |-
                        The site's navigation tree, drawn on the contents page. Authored here
                         rather than derived from where the documents live: publishing paths and
                         authoring paths are decoupled, and a site may aggregate several knowledge
                         bases with no single folder structure between them.
                authorName:
                    type: string
                    description: |-
                        The name shown as the byline on every page of this site. Empty means the
                         site's display name is used instead.

                         It is site configuration and never an account: a login name is half of a
                         credential pair, and which account happened to click "publish" is not what
                         a reader is being told when a page says who wrote it.
                searchMode:
                    type: string
                    description: |-
                        The site-level search mode. Anonymous readers have no preferences of their
                         own, so this is site configuration rather than a user setting.

                         Reserved, not yet honoured: site search currently does substring matching
                         with no index behind it, so there is no mode to pick between. It is stored
                         and returned as written until the indexed search of
                         docs/dev/design/20260823-public-publishing/tech-design.md §5 lands.
                createTime:
                    readOnly: true
                    type: string
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    format: date-time
            description: |-
                Site is a blog space: an outward-facing site with its own name, domain, theme
                 and home page. A site belongs to a team, not to a workspace — which documents
                 it carries is decided article by article.
        SiteMenuItem:
            type: object
            properties:
                label:
                    type: string
                    description: What the reader sees.
                path:
                    type: string
                    description: |-
                        Where it goes, relative to the site root: "" for the home page, "search"
                         for the search page, or a page's slug. Never an absolute URL — the menu is
                         in-site navigation, not a link list.
            description: SiteMenuItem is one entry of the site's top menu.
        SiteNavItem:
            type: object
            properties:
                label:
                    type: string
                    description: What the reader sees.
                slug:
                    type: string
                    description: |-
                        The slug of the page this node opens, empty for a pure grouping node.
                         Never an absolute URL: the tree is in-site navigation.
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/SiteNavItem'
            description: |-
                SiteNavItem is one node of the site's navigation tree. A node either points
                 at a page (`slug`), groups other nodes, or both.
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        StorageSetting_S3Config:
            type: object
            properties:
                accessKeyId:
                    type: string
                accessKeySecret:
                    writeOnly: true
                    type: string
                endpoint:
                    type: string
                region:
                    type: string
                bucket:
                    type: string
                usePathStyle:
                    type: boolean
                insecureSkipTlsVerify:
                    type: boolean
                    description: |-
                        insecure_skip_tls_verify disables TLS certificate verification when connecting
                         to the S3 endpoint. Only enable this for trusted endpoints that use a self-signed
                         certificate; it removes protection against man-in-the-middle attacks.
            description: |-
                S3 configuration for cloud storage backend.
                 Reference: https://developers.cloudflare.com/r2/examples/aws/aws-sdk-go/
        TestAIProviderRequest:
            type: object
            properties:
                providerId:
                    type: string
                    description: |-
                        Optional. References an existing provider in the stored AI setting. When set and
                         api_key is empty, the stored API key for this provider is used.
                type:
                    enum:
                        - AI_PROVIDER_TYPE_UNSPECIFIED
                        - OPENAI
                        - GEMINI
                    type: string
                    description: The provider type to test.
                    format: enum
                endpoint:
                    type: string
                    description: Optional. The endpoint to test. Falls back to the provider's default endpoint when empty.
                apiKey:
                    writeOnly: true
                    type: string
                    description: The API key to test with. Required unless provider_id references a provider with a stored key.
                model:
                    type: string
                    description: The model ID to use for the test call.
                capability:
                    enum:
                        - CAPABILITY_UNSPECIFIED
                        - CHAT
                        - EMBEDDING
                    type: string
                    description: |-
                        Optional. The capability to test. Determines which provider endpoint the
                         probe calls. Defaults to CHAT when unset.
                    format: enum
            description: Request message for TestAIProvider.
        TestAIProviderResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: success indicates whether the live API call succeeded.
                message:
                    type: string
                    description: 'message describes the result: a short success confirmation, or the error returned by the provider.'
            description: Response message for TestAIProvider.
        TestInstanceEmailSettingRequest:
            type: object
            properties:
                email:
                    allOf:
                        - $ref: '#/components/schemas/NotificationSetting_EmailSetting'
                    description: Optional. SMTP email settings to test. If omitted, the stored notification email setting is used.
                recipientEmail:
                    type: string
                    description: Optional. Recipient email address. If omitted, the current user's email address is used.
            description: Request message for TestInstanceEmailSetting method.
        TranscribeRequest:
            required:
                - audio
            type: object
            properties:
                audio:
                    allOf:
                        - $ref: '#/components/schemas/TranscriptionAudio'
                    description: Required. Audio input.
        TranscribeResponse:
            type: object
            properties:
                text:
                    type: string
                    description: The transcribed text.
        TranscriptionAudio:
            type: object
            properties:
                content:
                    writeOnly: true
                    type: string
                    description: Inline audio bytes.
                    format: bytes
                uri:
                    type: string
                    description: URI for audio content. Reserved for future use.
                filename:
                    type: string
                    description: Optional. The uploaded filename.
                contentType:
                    type: string
                    description: Optional. The MIME type of the input audio.
        UnlockVaultRequest:
            required:
                - proof
            type: object
            properties:
                proof:
                    type: string
                    description: |-
                        Required. HMAC-SHA256(master key, "toucan-attach/unlock/v1"), base64-encoded,
                         computed client-side from the unwrapped master key. Compared against the
                         caller's stored unlock_verifier in constant time.
        UnpublishMemoResponse:
            type: object
            properties:
                affectedPublications:
                    type: array
                    items:
                        $ref: '#/components/schemas/Publication'
                    description: |-
                        Published pages on this site that linked to the page just taken down. Their
                         snapshots keep the now-dead link until they are republished, which is the
                         price the snapshot model pays.
        UpdateSecretBlockPolicyRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: 'Required. Format: secretBlocks/{secret_block}'
                policy:
                    allOf:
                        - $ref: '#/components/schemas/SecretBlockPolicy'
                    description: The new policy. Unset lifts the restriction.
        UpdateWorkspaceFolderSortRequest:
            required:
                - parent
                - path
            type: object
            properties:
                parent:
                    type: string
                    description: 'Required. Format: workspaces/{workspace}'
                path:
                    type: string
                    description: Required. The folder path whose sort override is being set.
                sortField:
                    type: string
                    description: The sort field to pin this folder to, or empty to go back to inheriting.
                sortOrder:
                    type: string
                    description: The sort direction to pin this folder to, or empty to go back to inheriting.
        UpsertMemoReactionRequest:
            required:
                - name
                - reaction
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Required. The resource name of the memo.
                         Format: memos/{memo}
                reaction:
                    allOf:
                        - $ref: '#/components/schemas/Reaction'
                    description: Required. The reaction to upsert.
        User:
            required:
                - role
                - username
                - state
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the user.
                         Format: users/{user}
                role:
                    enum:
                        - ROLE_UNSPECIFIED
                        - ADMIN
                        - USER
                    type: string
                    description: The role of the user.
                    format: enum
                username:
                    type: string
                    description: Required. The unique username for login.
                email:
                    type: string
                    description: Optional. The email address of the user.
                displayName:
                    type: string
                    description: Optional. The display name of the user.
                avatarUrl:
                    type: string
                    description: Optional. The avatar URL of the user.
                description:
                    type: string
                    description: Optional. The description of the user.
                password:
                    writeOnly: true
                    type: string
                    description: Input only. The password for the user.
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - NORMAL
                        - ARCHIVED
                    type: string
                    description: The state of the user.
                    format: enum
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. The creation timestamp.
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    description: Output only. The last update timestamp.
                    format: date-time
        UserNotification:
            type: object
            properties:
                name:
                    readOnly: true
                    type: string
                    description: |-
                        The resource name of the notification.
                         Format: users/{user}/notifications/{notification}
                sender:
                    readOnly: true
                    type: string
                    description: |-
                        The sender of the notification.
                         Format: users/{user}
                senderUser:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The sender user details.
                status:
                    enum:
                        - STATUS_UNSPECIFIED
                        - UNREAD
                        - ARCHIVED
                    type: string
                    description: The status of the notification.
                    format: enum
                createTime:
                    readOnly: true
                    type: string
                    description: The creation timestamp.
                    format: date-time
                type:
                    readOnly: true
                    enum:
                        - TYPE_UNSPECIFIED
                        - MEMO_COMMENT
                        - MEMO_MENTION
                    type: string
                    description: The type of the notification.
                    format: enum
                memoComment:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/UserNotification_MemoCommentPayload'
                memoMention:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/UserNotification_MemoMentionPayload'
        UserNotification_MemoCommentPayload:
            type: object
            properties:
                memo:
                    type: string
                    description: |-
                        The memo name of comment.
                         Format: memos/{memo}
                relatedMemo:
                    type: string
                    description: |-
                        The name of related memo.
                         Format: memos/{memo}
                memoSnippet:
                    type: string
                    description: Preview text of the comment memo.
                relatedMemoSnippet:
                    type: string
                    description: Preview text of the related memo.
        UserNotification_MemoMentionPayload:
            type: object
            properties:
                memo:
                    type: string
                    description: |-
                        The memo that contains the mention.
                         Format: memos/{memo}
                relatedMemo:
                    type: string
                    description: |-
                        The related parent memo when the mention was created in a comment.
                         Format: memos/{memo}
                memoSnippet:
                    type: string
                    description: Preview text of the memo that contains the mention.
                relatedMemoSnippet:
                    type: string
                    description: Preview text of the related parent memo.
        UserSetting:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the user setting.
                         Format: users/{username}/settings/{setting}, {setting} is the key for the setting.
                         For example, "users/steven/settings/GENERAL" for general settings.
                generalSetting:
                    $ref: '#/components/schemas/UserSetting_GeneralSetting'
                webhooksSetting:
                    $ref: '#/components/schemas/UserSetting_WebhooksSetting'
                tagsSetting:
                    $ref: '#/components/schemas/UserSetting_TagsSetting'
                lastOpenedSetting:
                    $ref: '#/components/schemas/UserSetting_LastOpenedSetting'
                ragSearchSetting:
                    $ref: '#/components/schemas/UserSetting_RagSearchSetting'
                secretKeySetting:
                    $ref: '#/components/schemas/UserSetting_SecretKeySetting'
            description: User settings message
        UserSetting_GeneralSetting:
            type: object
            properties:
                locale:
                    type: string
                    description: The preferred locale of the user.
                memoVisibility:
                    type: string
                    description: The default visibility of the memo.
                theme:
                    type: string
                    description: |-
                        The preferred theme of the user.
                         This references a CSS file in the web/public/themes/ directory.
                         If not set, the default theme will be used.
                softBreakDefault:
                    type: boolean
                    description: |-
                        Whether a single newline is a soft wrap (CommonMark) rather than a hard line
                         break, for documents that have not set `DocConfig.soft_break` themselves.
                         False — hard breaks — is the historical behaviour and stays the default.
            description: General user settings configuration.
        UserSetting_LastOpenedSetting:
            type: object
            properties:
                workspace:
                    type: string
                    description: 'The workspace resource name last opened. Format: workspaces/{workspace}'
                memo:
                    type: string
                    description: |-
                        The memo resource name last opened. Format: memos/{memo}
                         Deprecated: superseded by workspace_memos, kept for backward compatibility.
                workspaceMemos:
                    type: object
                    additionalProperties:
                        type: string
                    description: Map of workspace resource name to the memo resource name last opened within it.
            description: The last workspace/document the user had open in the Notebook home page.
        UserSetting_RagSearchSetting:
            type: object
            properties:
                maxResultDocs:
                    type: integer
                    description: Max documents to return. Zero falls back to the engine default (20).
                    format: int32
                mode:
                    type: string
                    description: 'Retrieval mode: one of "MIXED", "KEYWORD", "SEMANTIC". Empty falls back to "MIXED".'
            description: Per-user RAG search preferences.
        UserSetting_SecretKeySetting:
            type: object
            properties:
                kdf:
                    type: string
                    description: Key derivation for the wrapping key. Always "pbkdf2-sha256" today.
                kdfIterations:
                    type: integer
                    description: Iteration count for the KDF.
                    format: int32
                cipher:
                    type: string
                    description: The AEAD cipher. Always "aes-256-gcm" today.
                salt:
                    type: string
                    description: Base64 KDF salt.
                nonce:
                    type: string
                    description: Base64 AEAD nonce.
                verifier:
                    type: string
                    description: |-
                        Base64 HMAC over the canonical parameter header, letting the client tell a
                         wrong passphrase from a damaged wrapper.
                wrappedKey:
                    type: string
                    description: |-
                        Base64 AEAD ciphertext of the master key, tag appended. Empty when the user
                         has not set a master passphrase yet.
                unlockVerifier:
                    type: string
                    description: |-
                        HMAC-SHA256(master key, "toucan-attach/unlock/v1"), base64-encoded, computed
                         client-side from the unwrapped master key. Unlike `verifier` above, the
                         server stores and compares this value — it is what AttachmentService.
                         UnlockVault checks a client-submitted proof against. Empty until the client
                         backfills it (see the message's own SecretKeyUserSetting counterpart in
                         proto/store/user_setting.proto for why a legacy user may not have one yet).
            description: |-
                The user's `toucan-secret` master key, wrapped under a passphrase in the
                 browser. Every field is opaque to the server, which holds neither the master
                 key nor the passphrase and cannot recover either.

                 Blocks encrypt against the master key, not the passphrase, so changing the
                 passphrase replaces only this record — no block is touched. Conversely,
                 clearing this record renders every `toucan-secret` block permanently
                 unreadable, which is why there is no way to unset it by accident.
        UserSetting_TagMetadata:
            type: object
            properties:
                backgroundColor:
                    allOf:
                        - $ref: '#/components/schemas/Color'
                    description: |-
                        Optional background color for the tag label.
                         When unset, the default tag color is used.
                blurContent:
                    type: boolean
                    description: Whether memos with this tag should have their content blurred.
            description: Tag metadata for user-specific display rules.
        UserSetting_TagsSetting:
            type: object
            properties:
                tags:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/UserSetting_TagMetadata'
                    description: |-
                        Map of tag name pattern to tag metadata.
                         Each key is treated as an anchored regular expression (^pattern$).
            description: User-specific tag metadata.
        UserSetting_WebhooksSetting:
            type: object
            properties:
                webhooks:
                    type: array
                    items:
                        $ref: '#/components/schemas/UserWebhook'
                    description: List of user webhooks.
            description: User webhooks configuration.
        UserStats:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the user whose stats these are.
                         Format: users/{user}
                memoTypeStats:
                    allOf:
                        - $ref: '#/components/schemas/UserStats_MemoTypeStats'
                    description: The stats of memo types.
                tagCount:
                    type: object
                    additionalProperties:
                        type: integer
                        format: int32
                    description: The count of tags.
                memoCreatedTimestamps:
                    type: array
                    items:
                        type: string
                        format: date-time
                    description: The creation timestamps of the user's memos.
                memoUpdatedTimestamps:
                    type: array
                    items:
                        type: string
                        format: date-time
                    description: |-
                        The latest update timestamps of the user's memos (one per memo,
                         mirrors memo_created_timestamps). Used by the activity heatmap when
                         the client's view is set to update_time basis.
                pinnedMemos:
                    type: array
                    items:
                        type: string
                    description: The pinned memos of the user.
                totalMemoCount:
                    type: integer
                    description: Total memo count.
                    format: int32
            description: User statistics messages
        UserStats_MemoTypeStats:
            type: object
            properties:
                linkCount:
                    type: integer
                    format: int32
                codeCount:
                    type: integer
                    format: int32
                todoCount:
                    type: integer
                    format: int32
                undoCount:
                    type: integer
                    format: int32
            description: Memo type statistics.
        UserWebhook:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the webhook.
                         Format: users/{user}/webhooks/{webhook}
                url:
                    type: string
                    description: The URL to send the webhook to.
                displayName:
                    type: string
                    description: Optional. Human-readable name for the webhook.
                createTime:
                    readOnly: true
                    type: string
                    description: The creation time of the webhook.
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    description: The last update time of the webhook.
                    format: date-time
                signingSecret:
                    writeOnly: true
                    type: string
                    description: |-
                        Optional. Signing secret used to HMAC-SHA256 sign the webhook request body.
                         This field is input-only; it is never returned in responses.
                signingSecretSet:
                    readOnly: true
                    type: boolean
                    description: Whether a signing secret is configured for this webhook.
            description: UserWebhook represents a webhook owned by a user.
        Workspace:
            required:
                - title
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the workspace.
                         Format: workspaces/{workspace}
                title:
                    type: string
                    description: Required. The display title of the workspace.
                creator:
                    readOnly: true
                    type: string
                    description: |-
                        Output only. The name of the creator.
                         Format: users/{user}
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. The creation timestamp.
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    description: Output only. The last update timestamp.
                    format: date-time
                sortField:
                    type: string
                    description: |-
                        The field used to sort the workspace's document tree.
                         One of "createTime", "updateTime", "alphabetical". Defaults to "createTime".
                sortOrder:
                    type: string
                    description: |-
                        The order used to sort the workspace's document tree.
                         One of "asc", "desc". Defaults to "desc".
                coverColor:
                    type: string
                    description: The cover color of the workspace, as a CSS color value (e.g. "#3b82f6").
                coverImage:
                    type: string
                    description: 'The cover image of the workspace. Format: attachments/{attachment}'
                foldersFirst:
                    type: boolean
                    description: Whether folders are always sorted before documents at the same level.
                displayOrder:
                    type: integer
                    description: |-
                        Manual position on the bookshelf. Smaller sorts first. Neither unique nor
                         contiguous — ties fall back to create_time.
                    format: int32
                hidden:
                    type: boolean
                    description: |-
                        Whether the workspace is hidden (a soft delete). Hidden workspaces are left
                         out of list responses unless show_hidden is set, but stay readable by name.
        WorkspaceFolder:
            required:
                - path
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the folder.
                         Format: workspaces/{workspace}/folders/{folder}
                path:
                    type: string
                    description: Required. The slash-separated path of the folder, relative to the workspace root.
                sortField:
                    type: string
                    description: |-
                        This folder's own sort override, governing how its direct children are
                         ordered. Empty means "inherit": the nearest ancestor folder that sets one
                         wins, and failing that the workspace's own setting. One of "createTime",
                         "updateTime", "alphabetical".
                sortOrder:
                    type: string
                    description: |-
                        This folder's own sort direction override. Empty means inherit, exactly as
                         sort_field does. One of "asc", "desc".
        WorkspaceGrant:
            required:
                - user
                - role
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The resource name of the grant.
                         Format: workspaces/{workspace}/grants/{grant}
                user:
                    type: string
                    description: 'Required. The member this grant is issued to. Format: users/{user}'
                role:
                    enum:
                        - ROLE_UNSPECIFIED
                        - VIEWER
                        - EDITOR
                    type: string
                    description: Required. The access level granted.
                    format: enum
                workspace:
                    readOnly: true
                    type: string
                    description: 'Output only. The workspace this grant applies to. Format: workspaces/{workspace}'
                granter:
                    readOnly: true
                    type: string
                    description: 'Output only. Who issued the grant. Format: users/{user}'
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. When the grant was issued.
                    format: date-time
            description: |-
                WorkspaceGrant is one member's access to one knowledge base. The team owner (the
                 single ADMIN account) never has a grant: its access to every workspace is implicit.
        WorkspaceTreeByTitle:
            type: object
            properties:
                requestedTitle:
                    type: string
                    description: |-
                        The title as it was requested, so the caller can match responses to
                         requests without re-normalizing.
                available:
                    type: boolean
                    description: |-
                        False when the knowledge base does not exist OR the caller may not read it.
                         The two cases are deliberately indistinguishable; every other field is left
                         empty in that case.
                name:
                    type: string
                    description: 'Format: workspaces/{workspace}'
                title:
                    type: string
                    description: The title in its stored casing.
                nodes:
                    type: array
                    items:
                        $ref: '#/components/schemas/WorkspaceTreeNode'
        WorkspaceTreeNode:
            type: object
            properties:
                type:
                    enum:
                        - NODE_TYPE_UNSPECIFIED
                        - FOLDER
                        - DOCUMENT
                    type: string
                    format: enum
                name:
                    type: string
                    description: The display name of this node (folder name, or document title).
                path:
                    type: string
                    description: The full slash-separated path of this node, relative to the workspace root.
                memo:
                    type: string
                    description: 'Set only when type == DOCUMENT. Format: memos/{memo}'
                archived:
                    type: boolean
                    description: Set only when type == DOCUMENT.
                docType:
                    type: string
                    description: Set only when type == DOCUMENT. One of MARKDOWN, HTML.
                createTime:
                    type: string
                    description: Set only when type == DOCUMENT.
                    format: date-time
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/WorkspaceTreeNode'
                    description: Children of this node, populated only for FOLDER nodes.
                updateTime:
                    type: string
                    description: Set only when type == DOCUMENT.
                    format: date-time
                sortField:
                    type: string
                    description: |-
                        Set only when type == FOLDER: this folder's OWN sort override, empty when it
                         inherits. Deliberately not the resolved value — a client that only saw the
                         resolved one could not tell an inherited setting from one set here, and so
                         could not offer "back to inherited".
                sortOrder:
                    type: string
                    description: Set only when type == FOLDER. Empty means inherit, as sort_field does.
                icon:
                    type: string
                    description: |-
                        Set only when type == DOCUMENT: the document's emoji icon, empty for the
                         doc-type default.
            description: A single node (folder or document) in a workspace's hierarchy.
tags:
    - name: AIService
    - name: AttachmentService
    - name: AuthService
    - name: IdentityProviderService
    - name: InstanceService
    - name: MemoService
    - name: PublicSiteService
      description: |-
        PublicSiteService is the anonymous read path for published sites.

         It is deliberately a separate service that only ever queries the publication
         tables. Unpublished content is not filtered out here — it is not in the query
         range at all, which is a stronger guarantee than remembering to add a
         condition. See docs/dev/requirements/20260823-public-blog-publishing.md §6.
    - name: RagService
    - name: SecretBlockService
      description: |-
        SecretBlockService stores the ciphertext behind `toucan-secret` fenced blocks.

         The server is a dumb vault: it never sees plaintext and never sees the user's
         passphrase. Encryption and decryption happen entirely in the browser, so there
         is deliberately no RPC here that could return plaintext — not even for debugging.

         A secret block belongs to the user who created it, NOT to the document that
         references it. Documents reference a secret by uid from their markdown body; a
         secret is never deleted as a side effect of deleting or copying a document.
    - name: ShortcutService
    - name: SiteService
      description: |-
        SiteService manages blog spaces and the documents published to them.

         Publishing is a separate link from sharing: a share hands one document to
         people who already have the link, while publishing pushes a snapshot of a
         document out to an audience that has to be able to find it. The two never
         share state — see
         docs/dev/requirements/20260823-public-blog-publishing.md §1.
    - name: UserService
    - name: WorkspaceService
