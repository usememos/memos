syntax = "proto3";

package memos.api;

import "api/instance_service.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";

option go_package = "gen/api";

// AIService runs AI tasks through the AI providers configured on the instance.
service AIService {
  // Transcribe transcribes an audio file with the instance's configured
  // transcription provider. The caller must be signed in, and requests are rate limited per user.
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse) {
    option (google.api.http) = {
      post: "/api/ai:transcribe"
      body: "*"
    };
    option (google.api.method_signature) = "audio";
  }
  // SuggestTags recommends tags for a Markdown draft, preferring the caller's existing vocabulary.
  rpc SuggestTags(SuggestTagsRequest) returns (SuggestTagsResponse) {
    option (google.api.http) = {
      post: "/api/ai:suggestTags"
      body: "*"
    };
    option (google.api.method_signature) = "content,candidate_tags";
    option (google.api.method_signature) = "content";
  }
  // ListAIProviderTypes describes the AI provider types this server supports: each type's default endpoint,
  // key rules and capabilities. The caller must be an administrator.
  rpc ListAIProviderTypes(ListAIProviderTypesRequest) returns (ListAIProviderTypesResponse) {
    option (google.api.http) = {get: "/api/ai/providerTypes"};
  }
  // ListAIProviderModels lists the models a configured provider reports. Errors carry the AI failure reasons of
  // InstanceService.UpdateInstanceSetting. The caller must be an administrator.
  rpc ListAIProviderModels(ListAIProviderModelsRequest) returns (ListAIProviderModelsResponse) {
    option (google.api.http) = {get: "/api/ai/providers/{provider_id}/models"};
    option (google.api.method_signature) = "provider_id";
  }
}

// Request message for AIService.ListAIProviderTypes.
message ListAIProviderTypesRequest {}

// Response message for AIService.ListAIProviderTypes.
message ListAIProviderTypesResponse {
  // Every supported type, in the order a picker should offer them.
  repeated AIProviderTypeInfo provider_types = 1;
}

// AIProviderTypeInfo describes one AI provider type.
message AIProviderTypeInfo {
  // The type described.
  InstanceSetting.AIProviderType type = 1;

  // The endpoint used when a provider leaves its endpoint empty. Empty when the type requires an endpoint.
  string default_endpoint = 2;

  // Whether a provider of this type needs an API key.
  bool api_key_required = 3;

  // Where to create an API key for this type. Empty when there is no single place.
  string api_key_url = 4;

  // Whether the service usually runs on the administrator's own machine or network rather than in the cloud.
  bool local = 5;

  // The capabilities a provider of this type can serve.
  repeated AICapability capabilities = 6;
}

// AICapability is one capability an AI provider type can serve.
message AICapability {
  // The capability.
  AICapabilityKind kind = 1;

  // A model that serves the capability well. Empty when there is no single good default.
  string suggested_model = 2;
}

// AICapabilityKind is a task the instance can hand to an AI provider.
enum AICapabilityKind {
  AI_CAPABILITY_KIND_UNSPECIFIED = 0;
  // Text generation, used by AIService.SuggestTags.
  TEXT_GENERATION = 1;
  // Speech to text, used by AIService.Transcribe.
  TRANSCRIPTION = 2;
}

// Request message for AIService.ListAIProviderModels.
message ListAIProviderModelsRequest {
  // Required. The ID of a provider in the instance's AI setting.
  string provider_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for AIService.ListAIProviderModels.
message ListAIProviderModelsResponse {
  // The model identifiers the provider reports, sorted. Empty when the provider does not list its models.
  repeated string models = 1;
}

// Request message for AIService.SuggestTags.
message SuggestTagsRequest {
  // The current Markdown draft, up to 64 KiB.
  string content = 1 [(google.api.field_behavior) = REQUIRED];
  // Optional vocabulary to prefer. Supply up to 64 tag values without the leading hash, each at most 256 bytes.
  // Values that are not valid tags are ignored.
  repeated string candidate_tags = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for AIService.SuggestTags.
message SuggestTagsResponse {
  // Up to three matching candidates, most relevant first. If none fit, this may contain one new tag.
  // Values omit the leading hash and exclude tags already in the draft. The list may be empty.
  repeated string tags = 1;
}

// Request message for AIService.Transcribe.
message TranscribeRequest {
  // Required. The audio to transcribe.
  TranscriptionAudio audio = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for AIService.Transcribe.
message TranscribeResponse {
  // The transcribed text.
  string text = 1;
}

// TranscriptionAudio is the audio input for a transcription.
message TranscriptionAudio {
  // The audio source. Only inline content is supported.
  oneof source {
    // Input only. Inline audio bytes, at most 25 MiB.
    bytes content = 1 [(google.api.field_behavior) = INPUT_ONLY];

    // URI of the audio content. Reserved for future use; the service rejects requests that set it.
    string uri = 2;
  }

  // Optional. The uploaded filename, at most 255 characters.
  string filename = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The MIME type of the audio. If empty, the service detects it from the content.
  string content_type = 4 [(google.api.field_behavior) = OPTIONAL];
}
