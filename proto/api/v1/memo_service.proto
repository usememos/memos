// MemoHistory is a snapshot (version) of a memo's content.
message MemoHistory {
  option (google.api.resource) = {
    type: "memos.api.v1/MemoHistory"
    pattern: "memos/{memo}/histories/{history}"
    singular: "history"
    plural: "histories"
  };

  // The resource name of the history record. Format: memos/{memo}/histories/{history}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. The user-supplied version name.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The memo title at snapshot time.
  string title = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The full memo content at snapshot time. Required on create.
  string content = 4;

  // Output only. The SHA-256 hex digest of the snapshot content + attachment set.
  string content_hash = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. When this version was created.
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The attachment set captured at snapshot time.
  repeated Attachment attachments = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. What produced this version. Set by the server; a client
  // creating a version always gets MANUAL.
  Source source = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What produced a version. Only AUTO versions are ever deleted.
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    // The user asked for this version and named it. Kept forever.
    MANUAL = 1;
    // Written by auto-save before it overwrote the stored content. Kept for a
    // bounded age and count per document, since these accumulate unprompted.
    AUTO = 2;
    // The last human-authored state before an AI write. Kept forever: once the
    // agent has overwritten it, this is the only copy of what the human wrote.
    AGENT_BASELINE = 3;
  }

  // A lightweight reference to an attachment captured in a version snapshot.
  message Attachment {
    // The attachment UID.
    string uid = 1;
    // The attachment filename.
    string filename = 2;
    // The MIME type of the attachment.
    string type = 3;
  }
}

message CreateMemoHistoryRequest {
  // Required. The resource name of the memo to snapshot.
  // Format: memos/{memo}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/Memo"}
  ];

  // Required. The version to create. Only display_name is read from the client;
  // title/content are captured from the memo's current state on the server.
  MemoHistory memo_history = 2 [(google.api.field_behavior) = REQUIRED];
}

message ListMemoHistoriesRequest {
