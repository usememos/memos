syntax = "proto3";

package memos.api.v1;

import "api/v1/attachment_service.proto";
import "api/v1/common.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api/v1";

service MemoService {
  // CreateMemo creates a memo. The request body is a Memo; set its content
  // (Markdown) and visibility (PRIVATE | PROTECTED | PUBLIC, default PRIVATE).
  // The memo is owned by the authenticated user; requires authentication.
  rpc CreateMemo(CreateMemoRequest) returns (Memo) {
    option (google.api.http) = {
      post: "/api/v1/memos"
      body: "memo"
    };
    option (google.api.method_signature) = "memo";
  }
  // ListMemos lists memos with pagination and filter.
  rpc ListMemos(ListMemosRequest) returns (ListMemosResponse) {
    option (google.api.http) = {get: "/api/v1/memos"};
    option (google.api.method_signature) = "";
  }
  // GetMemo gets a memo.
  rpc GetMemo(GetMemoRequest) returns (Memo) {
    option (google.api.http) = {get: "/api/v1/{name=memos/*}"};
    option (google.api.method_signature) = "name";
  }
  // UpdateMemo updates a memo.
  rpc UpdateMemo(UpdateMemoRequest) returns (Memo) {
    option (google.api.http) = {
      patch: "/api/v1/{memo.name=memos/*}"
      body: "memo"
    };
    option (google.api.method_signature) = "memo,update_mask";
  }
  // AcknowledgeAgentEdit records that a human opened the editor after an MCP
  // edit. It does not change content or the agent baseline-snapshot state.
  rpc AcknowledgeAgentEdit(AcknowledgeAgentEditRequest) returns (Memo) {
    option (google.api.http) = {
      post: "/api/v1/{name=memos/*}:acknowledgeAgentEdit"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
  // DeleteMemo deletes a memo.
  rpc DeleteMemo(DeleteMemoRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=memos/*}"};
    option (google.api.method_signature) = "name";
  }
  // SetMemoAttachments replaces the full set of attachments on a memo with the
  // provided list (not an append). Pass the complete desired set; an empty list
  // clears all attachments. Idempotent.
  rpc SetMemoAttachments(SetMemoAttachmentsRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/api/v1/{name=memos/*}/attachments"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
  // ListMemoAttachments lists attachments for a memo.
  rpc ListMemoAttachments(ListMemoAttachmentsRequest) returns (ListMemoAttachmentsResponse) {
    option (google.api.http) = {get: "/api/v1/{name=memos/*}/attachments"};
    option (google.api.method_signature) = "name";
  }
  // SetMemoRelations replaces the full set of relations on a memo with the
  // provided list (not an append). Pass the complete desired set; an empty list
  // clears all relations. Idempotent.
  rpc SetMemoRelations(SetMemoRelationsRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/api/v1/{name=memos/*}/relations"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
  // ListMemoRelations lists relations for a memo.
  rpc ListMemoRelations(ListMemoRelationsRequest) returns (ListMemoRelationsResponse) {
    option (google.api.http) = {get: "/api/v1/{name=memos/*}/relations"};
    option (google.api.method_signature) = "name";
  }
  // CreateMemoComment creates a comment for a memo.
  rpc CreateMemoComment(CreateMemoCommentRequest) returns (Memo) {
    option (google.api.http) = {
      post: "/api/v1/{name=memos/*}/comments"
      body: "comment"
    };
    option (google.api.method_signature) = "name,comment";
  }
  // ListMemoComments lists comments for a memo.
  rpc ListMemoComments(ListMemoCommentsRequest) returns (ListMemoCommentsResponse) {
    option (google.api.http) = {get: "/api/v1/{name=memos/*}/comments"};
    option (google.api.method_signature) = "name";
  }
  // ListMemoReactions lists reactions for a memo.
  rpc ListMemoReactions(ListMemoReactionsRequest) returns (ListMemoReactionsResponse) {
    option (google.api.http) = {get: "/api/v1/{name=memos/*}/reactions"};
    option (google.api.method_signature) = "name";
  }
  // UpsertMemoReaction adds or updates the authenticated user's reaction on a
  // memo. The reaction's content_id is the memo's resource name (memos/{memo}).
  rpc UpsertMemoReaction(UpsertMemoReactionRequest) returns (Reaction) {
    option (google.api.http) = {
      post: "/api/v1/{name=memos/*}/reactions"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
  // DeleteMemoReaction deletes a reaction for a memo.
  rpc DeleteMemoReaction(DeleteMemoReactionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=memos/*/reactions/*}"};
    option (google.api.method_signature) = "name";
  }
  // CreateMemoShare creates a share link for a memo. Requires authentication as the memo creator.
  rpc CreateMemoShare(CreateMemoShareRequest) returns (MemoShare) {
    option (google.api.http) = {
      post: "/api/v1/{parent=memos/*}/shares"
      body: "memo_share"
    };
    option (google.api.method_signature) = "parent,memo_share";
  }
  // ListMemoShares lists all share links for a memo. Requires authentication as the memo creator.
  rpc ListMemoShares(ListMemoSharesRequest) returns (ListMemoSharesResponse) {
    option (google.api.http) = {get: "/api/v1/{parent=memos/*}/shares"};
    option (google.api.method_signature) = "parent";
  }
  // DeleteMemoShare revokes a share link. Requires authentication as the memo creator.
  rpc DeleteMemoShare(DeleteMemoShareRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=memos/*/shares/*}"};
    option (google.api.method_signature) = "name";
  }
  // GetMemoByShare resolves a share token to its memo. No authentication required.
  // Returns NOT_FOUND if the token is invalid or expired.
  rpc GetMemoByShare(GetMemoByShareRequest) returns (Memo) {
    option (google.api.http) = {get: "/api/v1/shares/{share_id}"};
  }
  // CreateMemoHistory saves a manual snapshot (version) of a memo's current content.
  // Requires authentication as the memo creator.
  rpc CreateMemoHistory(CreateMemoHistoryRequest) returns (MemoHistory) {
    option (google.api.http) = {
      post: "/api/v1/{parent=memos/*}/histories"
      body: "memo_history"
    };
    option (google.api.method_signature) = "parent,memo_history";
  }
  // ListMemoHistories lists all saved versions for a memo, newest first.
  // Requires authentication as the memo creator.
  rpc ListMemoHistories(ListMemoHistoriesRequest) returns (ListMemoHistoriesResponse) {
    option (google.api.http) = {get: "/api/v1/{parent=memos/*}/histories"};
    option (google.api.method_signature) = "parent";
  }
  // RestoreMemoHistory switches a memo's content and attachment set to a saved
  // version. Fails with FAILED_PRECONDITION if the memo's current state doesn't
  // match its latest saved version (i.e. there are unsaved changes) — the caller
  // must save a version first. Attachments dropped by the restore are unlinked,
  // not deleted. Requires authentication as the memo creator.
  rpc RestoreMemoHistory(RestoreMemoHistoryRequest) returns (Memo) {
    option (google.api.http) = {
      post: "/api/v1/{name=memos/*/histories/*}:restore"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
  // GetLinkMetadata gets metadata for a link.
  rpc GetLinkMetadata(GetLinkMetadataRequest) returns (LinkMetadata) {
    option (google.api.http) = {get: "/api/v1/memos/-/linkMetadata"};
  }
  // BatchGetLinkMetadata gets metadata for links.
  rpc BatchGetLinkMetadata(BatchGetLinkMetadataRequest) returns (BatchGetLinkMetadataResponse) {
    option (google.api.http) = {
      post: "/api/v1/memos/-/linkMetadata:batchGet"
      body: "*"
    };
  }
}

// Visibility controls who can read a memo.
enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  // PRIVATE: only the creator can read the memo.
  PRIVATE = 1;
  // PROTECTED: signed-in users of the instance can read the memo.
  PROTECTED = 2;
  // PUBLIC: anyone, including anonymous visitors, can read the memo.
  PUBLIC = 3;
}

message Reaction {
  option (google.api.resource) = {
    type: "memos.api.v1/Reaction"
    pattern: "memos/{memo}/reactions/{reaction}"
    name_field: "name"
    singular: "reaction"
    plural: "reactions"
  };

  // The resource name of the reaction.
  // Format: memos/{memo}/reactions/{reaction}
  string name = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IDENTIFIER
  ];

  // The resource name of the creator.
  // Format: users/{user}
  string creator = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "memos.api.v1/User"}
  ];

  // The resource name of the content.
  // For memo reactions, this should be the memo's resource name.
  // Format: memos/{memo}
  string content_id = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/Memo"}
  ];

  // Required. The type of reaction (e.g., "👍", "❤️", "😄").
  string reaction_type = 4 [(google.api.field_behavior) = REQUIRED];

  // Output only. The creation timestamp.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message Memo {
  option (google.api.resource) = {
    type: "memos.api.v1/Memo"
    pattern: "memos/{memo}"
    name_field: "name"
    singular: "memo"
    plural: "memos"
  };

  // The resource name of the memo.
  // Format: memos/{memo}, memo is the user defined id or uuid.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The state of the memo.
  State state = 2 [(google.api.field_behavior) = REQUIRED];

  // The name of the creator.
  // Format: users/{user}
  string creator = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "memos.api.v1/User"}
  ];

  // The creation timestamp.
  // If not set on creation, the server will set it to the current time.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OPTIONAL];

  // The last update timestamp.
  // If not set on creation, the server will set it to the current time.
  google.protobuf.Timestamp update_time = 5 [(google.api.field_behavior) = OPTIONAL];

  reserved 6;
  reserved "display_time";

  // Required. The content of the memo in Markdown format.
  string content = 7 [(google.api.field_behavior) = REQUIRED];

  // The visibility of the memo.
  // One of PRIVATE (creator only), PROTECTED (signed-in users), or
  // PUBLIC (anyone). Defaults to PRIVATE on creation when unspecified.
  Visibility visibility = 9 [(google.api.field_behavior) = REQUIRED];

  // Output only. The tags extracted from the content.
  repeated string tags = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the memo is pinned.
  bool pinned = 11 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The attachments of the memo.
  repeated Attachment attachments = 12 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The relations of the memo.
  repeated MemoRelation relations = 13 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The reactions to the memo.
  repeated Reaction reactions = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The computed properties of the memo.
  Property property = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The name of the parent memo.
  // Format: memos/{memo}
  optional string parent = 16 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "memos.api.v1/Memo"}
  ];

  // Output only. The snippet of the memo content. Plain text only.
  string snippet = 17 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The location of the memo.
  optional Location location = 18 [(google.api.field_behavior) = OPTIONAL];

  // The workspace (knowledge base) this memo belongs to.
  // Format: workspaces/{workspace}
  // Optional on create: defaults to the caller's default workspace.
  string workspace = 19 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The slash-separated folder path (relative to the workspace root)
  // this memo lives under. Empty string means the workspace root.
  string folder_path = 20 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The document's display title (its "filename"). If unset on
  // creation, it is derived from the first H1 heading for Markdown documents.
  string title = 21 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The document type. Defaults to MARKDOWN.
  DocType doc_type = 22 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Set when this memo is a comment anchored to a location within
  // a PDF attachment.
  optional PdfAnnotation pdf_annotation = 23 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Set when this memo is a comment anchored to a heading within a
  // document memo (markdown/view).
  optional DocAnchor doc_anchor = 24 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Set when this memo is a comment anchored to a text range within
  // an EPUB attachment.
  optional EpubAnnotation epub_annotation = 26 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Supplementary per-node data keyed by an in-document node anchor id
  // (e.g. a `sheets` block's `id:`). The value is an opaque JSON string whose
  // shape is owned by the node's renderer; the server never parses it. Lets
  // clients attach overlay info (cell styles, etc.) to any addressable node
  // without touching that node's raw content.
  map<string, string> node_overlays = 25 [(google.api.field_behavior) = OPTIONAL];

  // Optional. How this document is framed by the app (body width, outline,
  // folder tree, properties panel). This is view configuration, not document
  // content: it is stored alongside the memo rather than in its frontmatter, so
  // changing it neither rewrites the document nor shows up in a memogit export.
  optional DocConfig doc_config = 27 [(google.api.field_behavior) = OPTIONAL];

  // Output only. An MCP edit is waiting to be seen in the document editor.
  // Opening the editor acknowledges it without changing the document content.
  bool agent_edit_pending = 28 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The document's icon: a single system emoji. Empty means the
  // doc-type default icon. Set with update_mask "icon"; clearing it restores
  // the default.
  string icon = 29 [(google.api.field_behavior) = OPTIONAL];

  enum DocType {
    DOC_TYPE_UNSPECIFIED = 0;
    MARKDOWN = 1;
    HTML = 2;
    PDF = 3;
    // A structured "view" document (e.g. gallery). Its content holds only a
    // JSON configuration (view type + scope + display rules), rendered
    // client-side against live data.
    VIEW = 4;
    // A published site's home page: the same block JSON as VIEW, but composed
    // of outward-facing blocks only, and rendered against publication
    // snapshots rather than live library data.
    //
    // Kept apart from VIEW because the two block sets are disjoint at both
    // ends — the reader ignores library blocks (their folder and property
    // rules have no meaning in a snapshot), and the app can only draw a
    // placeholder for outward-facing ones. Which set applies is decided when
    // the document is created, not by where it is later used, so it is a type
    // rather than a mode.
    BLOGVIEW = 5;
  }

  // Computed properties of a memo.
  message Property {
    bool has_link = 1;
    bool has_task_list = 2;
    bool has_code = 3;
    bool has_incomplete_tasks = 4;
    // The title extracted from the first H1 heading, if present.
    string title = 5;
  }
}

message Location {
  // A placeholder text for the location.
  string placeholder = 1 [(google.api.field_behavior) = OPTIONAL];

  // The latitude of the location.
  double latitude = 2 [(google.api.field_behavior) = OPTIONAL];

  // The longitude of the location.
  double longitude = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Anchors a comment to a location inside a PDF attachment. Two kinds of anchor
// coexist, mirroring DocAnchor's two levels:
//
// The text_* fields pin an exact span of the page's rendered text layer, so the
// comment draws as an in-text mark (highlight or underline) that follows the text
// across zoom and page-fit changes. They are the preferred anchor and are set for
// every mark made by selecting text.
//
// The normalized rect is the fallback, and the only anchor available for PDFs with
// no text layer at all (scanned/image-only documents), where text cannot be selected.
message PdfAnnotation {
  // The name of the attachment this annotation is anchored to.
  // Format: attachments/{uid}
  string attachment_name = 1 [(google.api.field_behavior) = REQUIRED];

  // 1-based page number.
  int32 page = 2 [(google.api.field_behavior) = REQUIRED];

  // Normalized (0~1) rect relative to the unrotated page dimensions. Always set, so
  // an annotation whose text anchor cannot be resolved still has somewhere to draw.
  double x = 3 [(google.api.field_behavior) = REQUIRED];
  double y = 4 [(google.api.field_behavior) = REQUIRED];
  double width = 5 [(google.api.field_behavior) = REQUIRED];
  double height = 6 [(google.api.field_behavior) = REQUIRED];

  // Optional selected text snippet, used as a fallback anchor if the rect drifts.
  string text_snippet = 7 [(google.api.field_behavior) = OPTIONAL];

  // The exact marked text, as it appeared in the page's rendered text layer. Empty
  // means this annotation has no text-level anchor and draws from the rect alone.
  string text_exact = 8 [(google.api.field_behavior) = OPTIONAL];

  // The rendered text immediately before / after `text_exact` (a bounded window),
  // used to pick the right occurrence when the same phrase repeats on the page.
  //
  // Unlike a document's markdown, a PDF's text never changes under the reader, so
  // these are not needed to survive edits — they are reused verbatim from DocAnchor
  // so both readers share one anchoring implementation.
  string text_prefix = 9 [(google.api.field_behavior) = OPTIONAL];
  string text_suffix = 10 [(google.api.field_behavior) = OPTIONAL];

  // The mark's color, as a preset key (e.g. "yellow", "blue"). Empty means no fill
  // (an underline-only mark).
  string color = 11 [(google.api.field_behavior) = OPTIONAL];

  // When true the mark renders as an underline in `color`; otherwise as a background
  // highlight. Ignored when `text_exact` is empty.
  bool underline = 12 [(google.api.field_behavior) = OPTIONAL];
}

// Anchors a comment to a location inside a document memo's own content. Two levels
// of precision coexist: the heading fields always identify the enclosing section,
// while the optional text_* fields pin an exact span of rendered text so the comment
// can also render as an in-text mark (highlight or underline).
//
// The text span is stored as a quote selector (prefix + exact + suffix) rather than
// as offsets, because a document's content is edited freely: matching by surrounding
// text survives insertions and deletions elsewhere, whereas an offset would not. When
// the span can no longer be found (the marked text itself was rewritten), clients fall
// back to the heading anchor instead of dropping the comment.
message DocAnchor {
  // The slug (DOM id) of the heading this comment is anchored to. Empty means the
  // comment is anchored to the top of the document (no preceding heading).
  string heading_slug = 1 [(google.api.field_behavior) = OPTIONAL];

  // The heading's display text, shown as the comment's anchor label.
  string heading_text = 2 [(google.api.field_behavior) = OPTIONAL];

  // The exact marked text, as it appeared in the rendered document. Empty means this
  // comment has no text-level anchor and is only attached to its heading.
  string text_exact = 3 [(google.api.field_behavior) = OPTIONAL];

  // The rendered text immediately before / after `text_exact` (a bounded window), used
  // to pick the right occurrence when the same phrase appears more than once, and to
  // re-locate the span after the surrounding text shifts.
  string text_prefix = 4 [(google.api.field_behavior) = OPTIONAL];
  string text_suffix = 5 [(google.api.field_behavior) = OPTIONAL];

  // The mark's color, as a preset key (e.g. "yellow", "blue"). Empty means the default.
  string color = 6 [(google.api.field_behavior) = OPTIONAL];

  // When true the mark renders as an underline in `color`; otherwise as a background
  // highlight. Ignored when `text_exact` is empty.
  bool underline = 7 [(google.api.field_behavior) = OPTIONAL];
}

// Per-document view configuration — how the app frames a document, as opposed to
// what the document says. Content semantics (date, status, tags) belong in the
// document's own frontmatter properties; these knobs deliberately do not, because
// they are meaningless outside this app and would otherwise pollute every exported
// markdown file.
//
// Every field uses explicit presence. Unset means "never configured" and resolves
// to the app default, which for `full_width` is true — so a plain bool could not
// tell an unconfigured document from one the author explicitly narrowed.
message DocConfig {
  // Whether the document body spans the full width of its pane. Default true.
  optional bool full_width = 1 [(google.api.field_behavior) = OPTIONAL];

  // Whether the outline panel opens by default on a desktop viewport. Default true.
  optional bool display_outline = 2 [(google.api.field_behavior) = OPTIONAL];

  // Whether the left secondary sidebar (the folder tree) stays expanded while this
  // document is open. Default true.
  optional bool display_filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // Whether the frontmatter properties panel renders above the body. Default true.
  optional bool show_properties = 4 [(google.api.field_behavior) = OPTIONAL];

  // Whether a single newline inside a paragraph is a soft wrap, as CommonMark
  // specifies, rather than a hard line break.
  //
  // The app has always rendered single newlines as hard breaks — the right call for
  // hand-typed notes, and wrong for markdown written anywhere else, where paragraphs
  // are routinely wrapped at some column and the wrapping is not meant to be seen.
  // Since a workspace holds both kinds of document, this is per-document rather than
  // a single global mode. Unset falls back to the author's global default (see
  // GeneralSetting.soft_break_default), which preserves the historical hard-break
  // behaviour.
  optional bool soft_break = 5 [(google.api.field_behavior) = OPTIONAL];
}

message EpubAnnotation {
  // The name of the attachment this annotation is anchored to.
  // Format: attachments/{uid}
  string attachment_name = 1 [(google.api.field_behavior) = REQUIRED];

  // The EPUB CFI range identifying the highlighted text span.
  string cfi_range = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional selected text snippet, shown as the comment's anchor label and used
  // as a fallback if the CFI range can't be resolved.
  string text_snippet = 3 [(google.api.field_behavior) = OPTIONAL];

  // The mark's color, as a preset key (e.g. "yellow", "blue"). Empty means the default.
  string color = 4 [(google.api.field_behavior) = OPTIONAL];

  // When true the mark renders as an underline in `color`; otherwise as a background highlight.
  bool underline = 5 [(google.api.field_behavior) = OPTIONAL];
}

message CreateMemoRequest {
  // Required. The memo to create.
  Memo memo = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The memo ID to use for this memo.
  // If empty, a unique ID will be generated.
  string memo_id = 2 [(google.api.field_behavior) = OPTIONAL];
}

message ListMemosRequest {
  // Optional. The maximum number of memos to return.
  // The service may return fewer than this value.
  // If unspecified, at most 50 memos will be returned.
  // The maximum value is 1000; values above 1000 will be coerced to 1000.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListMemos` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The state of the memos to list.
  // Default to `NORMAL`. Set to `ARCHIVED` to list archived memos.
  State state = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The order to sort results by.
  // Default to "create_time desc".
  // Supports comma-separated list of fields following AIP-132.
  // Example: "pinned desc, create_time desc" or "update_time asc"
  // Supported fields: pinned, create_time, update_time, name.
  // Note: order_by uses create_time / update_time, while the filter
  // expression uses created_ts / updated_ts for the same timestamps.
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A CEL expression to filter memos. Combine terms with && and ||.
  // Available fields:
  //   content (string), creator (string, e.g. "users/1"),
  //   created_ts / updated_ts (timestamp), pinned (bool),
  //   visibility (string: PRIVATE | PROTECTED | PUBLIC),
  //   doc_type (string: MARKDOWN | HTML | PDF | VIEW),
  //   tags (list<string>; match with `"work" in tags`, not `tag == "work"`),
  //   has_task_list / has_link / has_code / has_incomplete_tasks (bool).
  // Note: the time fields here are created_ts / updated_ts, which differ from
  // the create_time / update_time names used by order_by.
  // Examples:
  //   pinned == true && visibility == "PUBLIC"
  //   tags.exists(t, t == "urgent")
  //   content.contains("roadmap") && created_ts > now - duration("168h")
  string filter = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true, show deleted memos in the response.
  bool show_deleted = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Restrict results to memos in this workspace.
  // Format: workspaces/{workspace}
  string workspace = 7 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true, the response also carries the sub-documents of every
  // memo on this page in `sub_docs`. Sub-documents follow their parent: the
  // filter selects the parents, never the sub-documents themselves.
  bool include_sub_docs = 8 [(google.api.field_behavior) = OPTIONAL];
}

message ListMemosResponse {
  // The list of memos.
  repeated Memo memos = 1;

  // A token that can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;

  // The sub-documents of the memos in `memos`, when `include_sub_docs` was set.
  repeated Memo sub_docs = 3;

  // True when `include_sub_docs` was honoured. A server that predates the field
  // leaves it false, so a client can tell "no sub-documents" from "not asked".
  bool sub_docs_included = 4;
}

