syntax = "proto3";

package memos.store;

option go_package = "gen/store";

message MemoPayload {
  Property property = 1;

  Location location = 2;

  repeated string tags = 3;

  // Metadata for links found in the memo content, persisted at write time.
  repeated LinkMetadata links = 4;

  // The calculated properties from the memo content.
  message Property {
    bool has_link = 1;
    bool has_task_list = 2;
    bool has_code = 3;
    bool has_incomplete_tasks = 4;
    // The title extracted from the first H1 heading, if present.
    string title = 5;
  }

  message Location {
    string placeholder = 1;
    double latitude = 2;
    double longitude = 3;
  }

  // Metadata for a single link in the memo content.
  message LinkMetadata {
    string url = 1;
    string title = 2;
    string description = 3;
    // The original og:image URL, kept as a fallback.
    string image = 4;
    // The attachment name serving the locally cached cover image, if any.
    string cover_attachment_uid = 5;
    // Retry bookkeeping for failed metadata/cover fetches. Zero on success.
    int32 fetch_attempts = 6;
    // Unix seconds of the first failed attempt; retrying stops 24h after this.
    int64 first_attempt_at = 7;
    // Unix seconds of the most recent failed attempt; drives the backoff gate.
    int64 last_attempt_at = 8;
    // Display dimensions of the cached cover image, for aspect-aware tiles.
    int32 cover_width = 9;
    int32 cover_height = 10;
  }
}
