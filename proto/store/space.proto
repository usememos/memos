syntax = "proto3";

package memos.store;

option go_package = "gen/store";

// SpacePayload stores optional Space display metadata.
message SpacePayload {
  Icon icon = 1;

  message Icon {
    oneof value {
      // A Unicode emoji sequence.
      string emoji = 1;
      // A canonical Lucide icon name, such as "leaf".
      string lucide = 2;
    }
  }
}
