syntax = "proto3";

package memos.store;

option go_package = "gen/store";

message InboxMessage {
  message MemoCommentPayload {
    int32 memo_id = 1;
    int32 related_memo_id = 2;
  }

  message MemoMentionPayload {
    int32 memo_id = 1;
    int32 related_memo_id = 2;
  }

  message SpaceInvitationPayload {
    // The space the receiver was invited to join. The offered role and the
    // invitation state are resolved from the space membership at read time.
    int32 space_id = 1;
  }

  // The type of the inbox message.
  Type type = 1;
  oneof payload {
    MemoCommentPayload memo_comment = 2;
    MemoMentionPayload memo_mention = 3;
    SpaceInvitationPayload space_invitation = 4;
  }

  enum Type {
    TYPE_UNSPECIFIED = 0;
    // Memo comment notification.
    MEMO_COMMENT = 1;
    // Memo mention notification.
    MEMO_MENTION = 2;
    // Space invitation notification.
    SPACE_INVITATION = 3;
  }
}
