version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: github.com/usememos/memos/proto/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.18.1
    out: gen
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway:v2.30.0
    out: gen
    opt: paths=source_relative
  - remote: buf.build/community/google-gnostic-openapi
    out: gen
    opt: enum_type=string
  - remote: buf.build/bufbuild/es:v2.12.1
    out: ../web/src/types/proto
    opt:
      - target=ts
    include_imports: true
